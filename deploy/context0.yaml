apiVersion: apps/v1
kind: Deployment
metadata:
  name: context0-api
  namespace: context0
  labels:
    app: context0-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: context0-api
  template:
    metadata:
      labels:
        app: context0-api
    spec:
      containers:
        - name: context0-api
          image: context0/context0:dev
          ports:
            - containerPort: 50051
              name: grpc
            - containerPort: 8080
              name: http
          env:
            - name: CONTEXT0_DATABASE_URL
              value: "postgres://context0:context0-dev-password@postgres-age.context0.svc.cluster.local:5432/context0?sslmode=disable"
            - name: CONTEXT0_GRPC_PORT
              value: "50051"
            - name: CONTEXT0_HTTP_PORT
              value: "8080"
            - name: CONTEXT0_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: context0-api-keys
                  key: keys
          resources:
            requests:
              memory: "128Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: context0-api
  namespace: context0
  labels:
    app: context0-api
spec:
  type: ClusterIP
  ports:
    - port: 50051
      targetPort: 50051
      name: grpc
    - port: 8080
      targetPort: 8080
      name: http
  selector:
    app: context0-api
---
# NodePort for kind cluster access
apiVersion: v1
kind: Service
metadata:
  name: context0-api-nodeport
  namespace: context0
spec:
  type: NodePort
  ports:
    - port: 50051
      targetPort: 50051
      nodePort: 30051
      name: grpc
    - port: 8080
      targetPort: 8080
      nodePort: 30080
      name: http
  selector:
    app: context0-api
---
apiVersion: v1
kind: Secret
metadata:
  name: context0-api-keys
  namespace: context0
type: Opaque
stringData:
  keys: "ctx0_dev_key_1,ctx0_dev_key_2"
