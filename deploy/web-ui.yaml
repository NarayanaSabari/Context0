apiVersion: apps/v1
kind: Deployment
metadata:
  name: context0-web
  namespace: context0
  labels:
    app: context0-web
spec:
  replicas: 1
  selector:
    matchLabels:
      app: context0-web
  template:
    metadata:
      labels:
        app: context0-web
    spec:
      containers:
        - name: web
          image: context0/web:dev
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 80
              name: http
          resources:
            requests:
              memory: "32Mi"
              cpu: "10m"
            limits:
              memory: "64Mi"
              cpu: "100m"
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: context0-web
  namespace: context0
  labels:
    app: context0-web
spec:
  type: NodePort
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30000
      name: http
  selector:
    app: context0-web
