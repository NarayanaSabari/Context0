{{/*
Credentials.

Two rules drive this file:

  1. No working default credentials. A published chart with a default password
     is a published password: anyone who installs it unchanged has a system
     whose credentials are in a public Git repository. The chart therefore
     refuses to render rather than substituting something convenient.

  2. Secrets are referenced, never inlined. The connection string is assembled
     inside the container from a secret-mounted password, so the password does
     not appear in the Deployment spec where `kubectl get deploy -o yaml`
     would show it to anyone with read access.

Operators who already manage secrets elsewhere (External Secrets Operator,
Sealed Secrets, SOPS, the CSI driver) set `existingSecret` and this chart
creates nothing.
*/}}

{{- if not .Values.postgres.existingSecret }}
{{- if not .Values.postgres.password }}
{{- fail "postgres.password is required. Set it explicitly (--set postgres.password=...), or point postgres.existingSecret at a Secret you manage. This chart ships no default database password on purpose: a default in a public chart is a published credential." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: postgres-age-secret
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgres-age
type: Opaque
stringData:
  password: {{ .Values.postgres.password | quote }}
---
{{- end }}
{{- if and (not .Values.auth.existingSecret) (not .Values.auth.allowUnauthenticated) }}
{{- if not .Values.auth.apiKeys }}
{{- fail "auth.apiKeys is required. Generate one with `kora keys generate`, then pass it (--set auth.apiKeys=...), or point auth.existingSecret at a Secret you manage. Set auth.allowUnauthenticated=true only if something in front of this is doing authentication." }}
{{- end }}
apiVersion: v1
kind: Secret
metadata:
  name: kora-api-keys
  namespace: {{ .Release.Namespace }}
  labels:
    app: kora-api
type: Opaque
stringData:
  keys: {{ .Values.auth.apiKeys | quote }}
{{- end }}
