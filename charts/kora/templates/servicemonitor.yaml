{{- if .Values.metrics.serviceMonitor.enabled }}
# ServiceMonitor for the Prometheus Operator (kube-prometheus-stack).
#
# Guarded by a value because it depends on a CRD: on a cluster without the
# Prometheus Operator installed, rendering this unconditionally would make
# `helm install` fail with "no matches for kind ServiceMonitor".
#
# The API already exposes /metrics, and internal/auth exempts that path from
# API-key checks so scraping works without credentials. Note that this also
# means /metrics is reachable by anything that can reach the Service; keep the
# Service ClusterIP in production rather than NodePort.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: kora-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: kora-api
    {{- with .Values.metrics.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app: kora-api
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.metrics.serviceMonitor.interval }}
{{- end }}
