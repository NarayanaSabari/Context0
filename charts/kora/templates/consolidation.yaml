{{- if .Values.consolidation.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: kora-consolidation
  namespace: {{ .Release.Namespace }}
  labels:
    app: kora-consolidation
spec:
  schedule: {{ .Values.consolidation.schedule | quote }}
  # See the reasoning comment on consolidation in values.yaml: Forbid is what
  # makes this a singleton (no separate leader election needed), and
  # startingDeadlineSeconds bounds how late a skipped-and-rescheduled run can
  # be picked up.
  startingDeadlineSeconds: {{ .Values.consolidation.startingDeadlineSeconds }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: kora-consolidation
        spec:
          # No Kubernetes API access: this job only talks to Postgres.
          serviceAccountName: kora-consolidation-sa
          automountServiceAccountToken: false
          # Same restricted profile as the API: this runs the same binary
          # against the same database, so it gets the same constraints.
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            fsGroup: 1000
            seccompProfile:
              type: RuntimeDefault
          restartPolicy: OnFailure
          containers:
            - name: consolidation
              image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              imagePullPolicy: {{ .Values.api.image.pullPolicy }}
              command: ["kora-consolidate"]
              env:
                # Same as the API: the password comes from a Secret and is
                # interpolated at container start rather than baked into the
                # CronJob spec.
                - name: POSTGRES_PASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.postgres.existingSecret | default "postgres-age-secret" }}
                      key: {{ .Values.postgres.existingSecretKey | default "password" }}
                - name: KORA_LOG_LEVEL
                  value: {{ .Values.api.logLevel | quote }}
                - name: KORA_LOG_FORMAT
                  value: {{ .Values.api.logFormat | quote }}
                - name: KORA_DATABASE_URL
                  value: "postgres://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@postgres-age.{{ .Release.Namespace }}.svc.cluster.local:5432/{{ .Values.postgres.database }}?sslmode={{ .Values.postgres.sslMode }}"
                - name: CONSOLIDATION_DECAY_HALF_LIFE_DAYS
                  value: {{ .Values.consolidation.decayHalfLifeDays | quote }}
                - name: CONSOLIDATION_STALE_THRESHOLD
                  value: {{ .Values.consolidation.staleThreshold | quote }}
                - name: CONSOLIDATION_PRUNE_AGE_DAYS
                  value: {{ .Values.consolidation.pruneAgeDays | quote }}
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "250m"
{{- end }}
