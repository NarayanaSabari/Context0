{{- /*
Dedicated service accounts, one per workload, none of which can talk to the
Kubernetes API.

Every pod here previously ran as the namespace's `default` service account with
its token mounted at /var/run/secrets/kubernetes.io/serviceaccount/token. None
of these workloads call the Kubernetes API: the engine talks to Postgres, the
CronJob talks to Postgres, the web UI talks to the engine. The token was a
credential handed to processes that had no use for it, and confirmed live to
authenticate successfully against the API server.

That matters because the blast radius of a compromise is decided by what the
compromised process is holding. A remote code execution in a pod with no token
gets an attacker a shell in a container; the same bug in a pod with a mounted
token gets them an authenticated identity in the cluster, and every future
RoleBinding granted to `default` silently widens what that identity can do.

Separate accounts rather than one shared account, so that granting a permission
later (a CronJob that needs to read a ConfigMap, say) cannot silently also grant
it to the internet-facing API pod.
*/ -}}
{{- if .Values.serviceAccount.create }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kora-api-sa
  namespace: {{ .Release.Namespace }}
  labels:
    app: kora-api
# Belt and braces: this is set here and on the pod spec. The pod-level setting
# is what actually takes effect, and this one keeps the account safe by default
# if it is ever referenced by a workload that forgets to set it.
automountServiceAccountToken: false
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: postgres-age-sa
  namespace: {{ .Release.Namespace }}
  labels:
    app: postgres-age
automountServiceAccountToken: false
{{- if .Values.consolidation.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kora-consolidation-sa
  namespace: {{ .Release.Namespace }}
  labels:
    app: kora-consolidation
automountServiceAccountToken: false
{{- end }}
{{- if .Values.web.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kora-web-sa
  namespace: {{ .Release.Namespace }}
  labels:
    app: kora-web
automountServiceAccountToken: false
{{- end }}
{{- end }}
