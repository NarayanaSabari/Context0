{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kora-web
  namespace: {{ .Release.Namespace }}
  labels:
    app: kora-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: kora-web
  template:
    metadata:
      labels:
        app: kora-web
    spec:
      # No Kubernetes API access: this workload never calls it, so the
      # token would only be a credential available to steal.
      serviceAccountName: kora-web-sa
      automountServiceAccountToken: false
      # Satisfies the Pod Security "restricted" profile. The image is
      # nginx-unprivileged, which runs as uid 101 and listens on 8080, so no
      # capability is needed to bind the port.
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: 8080
              name: http
          env:
            # The image defaults these to the docker-compose service name
            # ("api"), which does not resolve in Kubernetes. nginx resolves
            # upstreams at startup and exits when the name is missing, so
            # without this the pod sits in CrashLoopBackOff with
            # "host not found in upstream".
            - name: API_HOST
              value: "kora-api.{{ .Release.Namespace }}.svc.cluster.local"
            - name: API_PORT
              value: {{ .Values.api.httpPort | quote }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          # The API must be resolvable before nginx will start, so give it a
          # startup window rather than restarting into the same failure.
          startupProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 8080
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: kora-web
  namespace: {{ .Release.Namespace }}
  labels:
    app: kora-web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: 80
      # The Service still answers on 80; the container listens on 8080 because
      # binding a privileged port would require a capability this pod drops.
      targetPort: 8080
      {{- if eq .Values.web.service.type "NodePort" }}
      nodePort: {{ .Values.web.service.nodePort }}
      {{- end }}
      name: http
  selector:
    app: kora-web
{{- end }}
