# Kora Helm Chart values

# API Server
api:
  replicas: 1
  image:
    repository: kora/kora
    tag: dev
    pullPolicy: IfNotPresent
  grpcPort: 50051
  httpPort: 8080
  # Must exceed the process's own 15s drain plus preStopSleepSeconds, or
  # Kubernetes SIGKILLs mid-drain and the connection pool is never closed.
  terminationGracePeriodSeconds: 30
  # Covers the gap between kubelet sending SIGTERM and kube-proxy finishing
  # endpoint removal. Without it, rollouts drop connections.
  preStopSleepSeconds: 5
  # Per-key request budget, enforced independently by each replica (the token
  # buckets are in process memory). The effective cluster limit is this times
  # replicas; use an ingress or service mesh if you need a true global budget.
  # 100 requests/second per key. High enough that normal use never sees a 429
  # (a store costs ~4ms), low enough that one runaway client cannot monopolise
  # the connection pool.
  rateLimitPerMinute: 6000
  # Structured logging. JSON is the default because the destination is a log
  # aggregator; set "text" when reading output directly during development.
  logLevel: info
  logFormat: json
  pool:
    # pgxpool otherwise defaults MaxConns to the NODE's core count, which has
    # nothing to do with this container's CPU limit: a few replicas on a large
    # node would exhaust Postgres's max_connections (100).
    maxConns: 10
    minConns: 2
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Prometheus scraping. Requires the Prometheus Operator CRDs
# (kube-prometheus-stack); left off so a plain install does not fail on a
# missing CRD.
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    # Set to the release label your Prometheus instance selects on.
    labels: {}

# PostgreSQL + Apache AGE + pgvector
postgres:
  image:
    repository: kora/postgres-age-vector
    tag: dev
    pullPolicy: IfNotPresent
  database: kora
  user: kora
  # REQUIRED. No default: a default password in a published chart is a
  # published password. Generate one, or set existingSecret instead.
  #   --set postgres.password="$(openssl rand -base64 24)"
  password: ""
  # Use a Secret you already manage (External Secrets Operator, Sealed Secrets,
  # SOPS, CSI driver). When set, this chart creates no Secret of its own.
  existingSecret: ""
  existingSecretKey: password
  # sslmode for the API's connection to Postgres. "disable" is the default only
  # because the in-cluster Postgres this chart ships does not serve TLS; point
  # at a TLS-terminating Postgres and set this to verify-full.
  sslMode: disable
  storage: 5Gi
  # /dev/shm size. Kubernetes defaults this to 64Mi, which is not enough to
  # build the pgvector HNSW index: at 94k embeddings the build asked for 131MB
  # in a single allocation and failed. That failure is only reachable on a
  # rebuild -- notably restoring a backup -- because a live index grows
  # incrementally, which is exactly why it goes unnoticed until recovery.
  #
  # Counts against the pod memory limit, since medium: Memory.
  shmSize: 256Mi
  # PostgreSQL does not size itself from the cgroup limit, so these are set
  # explicitly against the 1Gi limit below. shared_buffers is the usual ~25% of
  # available memory; effective_cache_size tells the planner how much the OS is
  # likely caching and makes index scans look as cheap as they really are.
  # Raise all four together with the resource limits.
  tuning:
    sharedBuffers: 512MB
    effectiveCacheSize: 1536MB
    workMem: 16MB
    # Used for index builds, including the pgvector HNSW index, which is far
    # faster when the graph fits in this.
    maintenanceWorkMem: 128MB
  # Sized from measurement, not convention. Under a soak of 8 concurrent
  # clients (~35 ops/s) this Postgres sustains ~1.5 cores: AGE traversals and
  # pgvector distance calculations are CPU-bound, not IO-bound.
  #
  # A 1000m limit therefore throttled it in 94% of scheduling periods, which is
  # invisible in every pod-level signal -- the container is Running, healthy,
  # under its memory limit, restarting never -- and shows up only as uniformly
  # slow queries. Removing the ceiling took store p50 from 396ms to 33ms and
  # query p50 from 523ms to 45ms, a 12x improvement from a value that had been
  # picked as a round number.
  #
  # The limit is deliberately absent rather than merely raised. CPU limits
  # throttle even when the node is idle, so a database that is briefly busy is
  # slowed for no gain; the request reserves what it needs, and burst capacity
  # is used when it happens to be free. Set postgres.resources.limits.cpu only
  # where a hard cap is required for quota or noisy-neighbour policy, and size
  # it well above 1.5 cores if so.
  # 2Gi, not 1Gi. The budget at 1Gi did not add up once /dev/shm was sized for
  # HNSW index builds: 256Mi of shm (medium: Memory counts against the pod
  # limit) plus 320MB shared_buffers plus work_mem per connection left too
  # little headroom, and a six-worker soak OOM-killed Postgres six times.
  #
  # Sized from what the parts actually claim rather than a round number:
  #   /dev/shm            256 MB   (index builds)
  #   shared_buffers      512 MB   (~25% of the limit)
  #   work_mem x 10       160 MB   (per sort, per connection)
  #   effective headroom  ~1 GB    (query execution, page cache, WAL buffers)
  resources:
    requests:
      memory: "1Gi"
      cpu: "1500m"
    limits:
      memory: "2Gi"

# Consolidation CronJob
consolidation:
  enabled: true
  schedule: "0 */6 * * *"  # every 6 hours
  decayHalfLifeDays: "30"
  staleThreshold: "0.1"
  pruneAgeDays: "30"

# Web UI
web:
  enabled: true
  replicas: 1
  image:
    repository: kora/web
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "32Mi"
      cpu: "10m"
    limits:
      memory: "64Mi"
      cpu: "100m"
  service:
    type: NodePort
    nodePort: 30000

# Pod Security Standards.
#
# Helm does not manage the namespace it installs into (--create-namespace makes
# a bare one), so these labels have to be applied to the namespace directly:
#
#   kubectl label namespace <ns> \
#     pod-security.kubernetes.io/enforce=restricted \
#     pod-security.kubernetes.io/enforce-version=latest
#
# Every workload in this chart satisfies "restricted". That was not true before:
# labelling the namespace is what revealed Postgres running as root with full
# capabilities and the web UI running as root, because only the API had ever
# been given a securityContext. Enforcing it means a future workload that
# regresses is refused admission rather than quietly running privileged.

# Network policy. Default-deny for the namespace, with only the flows this
# system needs opened explicitly.
#
# Verified as a real gap: before this, a pod in an unrelated namespace connected
# straight to Postgres and read every memory row, bypassing the API's
# authentication and rate limiting entirely.
#
# Enforcement is the CNI's job, not Kubernetes'. kind's default kindnet ignores
# NetworkPolicy, so these objects apply cleanly there and do nothing at all --
# check your CNI rather than assuming the resource existing means it is being
# enforced. Calico, Cilium, and the major managed CNIs all enforce it.
networkPolicy:
  enabled: true
  # Extra egress rules for the API pod: an external embedding provider, an OTLP
  # collector, a managed Postgres outside the cluster. Standard NetworkPolicy
  # egress syntax.
  apiExtraEgress: []

# Service accounts. One per workload, none able to reach the Kubernetes API.
#
# Every pod previously ran as the namespace `default` account with its token
# mounted, and none of these workloads call the Kubernetes API at all. Set
# create: false only if you supply accounts of your own, and keep
# automountServiceAccountToken disabled on them.
serviceAccount:
  create: true

# Authentication
auth:
  # REQUIRED unless allowUnauthenticated is true. Comma-separated.
  # Generate with: kora keys generate
  #
  # Note for --set: helm reads "," as a list separator, so more than one key
  # must be escaped or passed through a values file:
  #   --set-string auth.apiKeys="key1\,key2"
  #   -f my-values.yaml   (preferred for more than one key)
  # No default: shipping one would publish a working credential for every
  # install that does not change it.
  apiKeys: ""
  # Use a Secret you already manage instead of having the chart create one.
  existingSecret: ""
  existingSecretKey: keys
  # Escape hatch for deployments where something in front of the API already
  # authenticates (an ingress, a gateway, a service mesh). Leaving the key list
  # empty disables authentication in the server, so this makes that explicit
  # and deliberate rather than accidental.
  allowUnauthenticated: false

# Service exposure
service:
  type: ClusterIP
  # Set to NodePort for kind cluster testing
  nodePort:
    enabled: false
    grpc: 30051
    http: 30080
