# Context0 Helm Chart values

# API Server
api:
  replicas: 1
  image:
    repository: context0/context0
    tag: dev
    pullPolicy: IfNotPresent
  grpcPort: 50051
  httpPort: 8080
  # Must exceed the process's own 15s drain plus preStopSleepSeconds, or
  # Kubernetes SIGKILLs mid-drain and the connection pool is never closed.
  terminationGracePeriodSeconds: 30
  # Covers the gap between kubelet sending SIGTERM and kube-proxy finishing
  # endpoint removal. Without it, rollouts drop connections.
  preStopSleepSeconds: 5
  # Per-key request budget, enforced independently by each replica (the token
  # buckets are in process memory). The effective cluster limit is this times
  # replicas; use an ingress or service mesh if you need a true global budget.
  rateLimitPerMinute: 100
  pool:
    # pgxpool otherwise defaults MaxConns to the NODE's core count, which has
    # nothing to do with this container's CPU limit: a few replicas on a large
    # node would exhaust Postgres's max_connections (100).
    maxConns: 10
    minConns: 2
  resources:
    requests:
      memory: "128Mi"
      cpu: "100m"
    limits:
      memory: "512Mi"
      cpu: "500m"

# Prometheus scraping. Requires the Prometheus Operator CRDs
# (kube-prometheus-stack); left off so a plain install does not fail on a
# missing CRD.
metrics:
  serviceMonitor:
    enabled: false
    interval: 30s
    # Set to the release label your Prometheus instance selects on.
    labels: {}

# PostgreSQL + Apache AGE + pgvector
postgres:
  image:
    repository: context0/postgres-age-vector
    tag: dev
    pullPolicy: IfNotPresent
  database: context0
  user: context0
  # REQUIRED. No default: a default password in a published chart is a
  # published password. Generate one, or set existingSecret instead.
  #   --set postgres.password="$(openssl rand -base64 24)"
  password: ""
  # Use a Secret you already manage (External Secrets Operator, Sealed Secrets,
  # SOPS, CSI driver). When set, this chart creates no Secret of its own.
  existingSecret: ""
  existingSecretKey: password
  # sslmode for the API's connection to Postgres. "disable" is the default only
  # because the in-cluster Postgres this chart ships does not serve TLS; point
  # at a TLS-terminating Postgres and set this to verify-full.
  sslMode: disable
  storage: 5Gi
  # PostgreSQL does not size itself from the cgroup limit, so these are set
  # explicitly against the 1Gi limit below. shared_buffers is the usual ~25% of
  # available memory; effective_cache_size tells the planner how much the OS is
  # likely caching and makes index scans look as cheap as they really are.
  # Raise all four together with the resource limits.
  tuning:
    sharedBuffers: 256MB
    effectiveCacheSize: 768MB
    workMem: 16MB
    # Used for index builds, including the pgvector HNSW index, which is far
    # faster when the graph fits in this.
    maintenanceWorkMem: 128MB
  resources:
    requests:
      memory: "512Mi"
      cpu: "250m"
    limits:
      memory: "1Gi"
      cpu: "1000m"

# Consolidation CronJob
consolidation:
  enabled: true
  schedule: "0 */6 * * *"  # every 6 hours
  decayHalfLifeDays: "30"
  staleThreshold: "0.1"
  pruneAgeDays: "30"

# Web UI
web:
  enabled: true
  replicas: 1
  image:
    repository: context0/web
    tag: dev
    pullPolicy: IfNotPresent
  resources:
    requests:
      memory: "32Mi"
      cpu: "10m"
    limits:
      memory: "64Mi"
      cpu: "100m"
  service:
    type: NodePort
    nodePort: 30000

# Authentication
auth:
  # REQUIRED unless allowUnauthenticated is true. Comma-separated.
  # Generate with: context0 keys generate
  #
  # Note for --set: helm reads "," as a list separator, so more than one key
  # must be escaped or passed through a values file:
  #   --set-string auth.apiKeys="key1\,key2"
  #   -f my-values.yaml   (preferred for more than one key)
  # No default: shipping one would publish a working credential for every
  # install that does not change it.
  apiKeys: ""
  # Use a Secret you already manage instead of having the chart create one.
  existingSecret: ""
  existingSecretKey: keys
  # Escape hatch for deployments where something in front of the API already
  # authenticates (an ingress, a gateway, a service mesh). Leaving the key list
  # empty disables authentication in the server, so this makes that explicit
  # and deliberate rather than accidental.
  allowUnauthenticated: false

# Service exposure
service:
  type: ClusterIP
  # Set to NodePort for kind cluster testing
  nodePort:
    enabled: false
    grpc: 30051
    http: 30080
