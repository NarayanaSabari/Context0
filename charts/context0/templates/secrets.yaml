apiVersion: v1
kind: Secret
metadata:
  name: postgres-age-secret
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  password: {{ .Values.postgres.password | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: context0-api-keys
  namespace: {{ .Release.Namespace }}
type: Opaque
stringData:
  keys: {{ .Values.auth.apiKeys | quote }}
