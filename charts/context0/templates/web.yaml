{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: context0-web
  namespace: {{ .Release.Namespace }}
  labels:
    app: context0-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: context0-web
  template:
    metadata:
      labels:
        app: context0-web
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
          env:
            # The image defaults these to the docker-compose service name
            # ("api"), which does not resolve in Kubernetes. nginx resolves
            # upstreams at startup and exits when the name is missing, so
            # without this the pod sits in CrashLoopBackOff with
            # "host not found in upstream".
            - name: API_HOST
              value: "context0-api.{{ .Release.Namespace }}.svc.cluster.local"
            - name: API_PORT
              value: {{ .Values.api.httpPort | quote }}
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          # The API must be resolvable before nginx will start, so give it a
          # startup window rather than restarting into the same failure.
          startupProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 3
            failureThreshold: 20
          livenessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /
              port: 80
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: context0-web
  namespace: {{ .Release.Namespace }}
  labels:
    app: context0-web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: 80
      targetPort: 80
      {{- if eq .Values.web.service.type "NodePort" }}
      nodePort: {{ .Values.web.service.nodePort }}
      {{- end }}
      name: http
  selector:
    app: context0-web
{{- end }}
