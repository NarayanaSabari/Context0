{{- if .Values.web.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: context0-web
  namespace: {{ .Release.Namespace }}
  labels:
    app: context0-web
spec:
  replicas: {{ .Values.web.replicas }}
  selector:
    matchLabels:
      app: context0-web
  template:
    metadata:
      labels:
        app: context0-web
    spec:
      containers:
        - name: web
          image: "{{ .Values.web.image.repository }}:{{ .Values.web.image.tag }}"
          imagePullPolicy: {{ .Values.web.image.pullPolicy }}
          ports:
            - containerPort: 80
              name: http
          resources:
            {{- toYaml .Values.web.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: context0-web
  namespace: {{ .Release.Namespace }}
  labels:
    app: context0-web
spec:
  type: {{ .Values.web.service.type }}
  ports:
    - port: 80
      targetPort: 80
      {{- if eq .Values.web.service.type "NodePort" }}
      nodePort: {{ .Values.web.service.nodePort }}
      {{- end }}
      name: http
  selector:
    app: context0-web
{{- end }}
