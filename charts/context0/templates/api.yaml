apiVersion: apps/v1
kind: Deployment
metadata:
  name: context0-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: context0-api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: context0-api
  template:
    metadata:
      labels:
        app: context0-api
    spec:
      containers:
        - name: context0-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          ports:
            - containerPort: {{ .Values.api.grpcPort }}
              name: grpc
            - containerPort: {{ .Values.api.httpPort }}
              name: http
          env:
            - name: CONTEXT0_DATABASE_URL
              value: "postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres-age.{{ .Release.Namespace }}.svc.cluster.local:5432/{{ .Values.postgres.database }}?sslmode=disable"
            - name: CONTEXT0_GRPC_PORT
              value: {{ .Values.api.grpcPort | quote }}
            - name: CONTEXT0_HTTP_PORT
              value: {{ .Values.api.httpPort | quote }}
            - name: CONTEXT0_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: context0-api-keys
                  key: keys
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /v1/health
              port: {{ .Values.api.httpPort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /v1/health
              port: {{ .Values.api.httpPort }}
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: context0-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: context0-api
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.api.grpcPort }}
      targetPort: {{ .Values.api.grpcPort }}
      name: grpc
      {{- if .Values.service.nodePort.enabled }}
      nodePort: {{ .Values.service.nodePort.grpc }}
      {{- end }}
    - port: {{ .Values.api.httpPort }}
      targetPort: {{ .Values.api.httpPort }}
      name: http
      {{- if .Values.service.nodePort.enabled }}
      nodePort: {{ .Values.service.nodePort.http }}
      {{- end }}
  selector:
    app: context0-api
