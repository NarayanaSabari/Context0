apiVersion: apps/v1
kind: Deployment
metadata:
  name: context0-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: context0-api
spec:
  replicas: {{ .Values.api.replicas }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      # Never drop below the requested replica count during a rollout. With
      # maxUnavailable > 0 a single-replica install would have a hard outage on
      # every upgrade.
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: context0-api
  template:
    metadata:
      labels:
        app: context0-api
      annotations:
        # Roll the pods whenever the API keys change, so a rotated secret is
        # actually picked up instead of lingering until the next unrelated
        # deploy.
        checksum/secret: {{ include (print $.Template.BasePath "/secrets.yaml") . | sha256sum }}
    spec:
      # Long enough for the in-process 15s drain to finish, with headroom for
      # the preStop sleep below.
      terminationGracePeriodSeconds: {{ .Values.api.terminationGracePeriodSeconds }}
      {{- if gt (int .Values.api.replicas) 1 }}
      # Spread replicas across nodes so a single node failure cannot take out
      # the whole API. ScheduleAnyway keeps single-node clusters (kind, minikube)
      # schedulable.
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: context0-api
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: context0-api
          image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
          imagePullPolicy: {{ .Values.api.image.pullPolicy }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          ports:
            - containerPort: {{ .Values.api.grpcPort }}
              name: grpc
            - containerPort: {{ .Values.api.httpPort }}
              name: http
          env:
            # The password arrives from a Secret and is interpolated by the
            # kubelet at container start, so it never appears in the Deployment
            # spec. Inlining it here would expose it to anyone who can run
            # `kubectl get deploy -o yaml`, which is a much wider set of people
            # than those who can read Secrets.
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.existingSecret | default "postgres-age-secret" }}
                  key: {{ .Values.postgres.existingSecretKey | default "password" }}
            - name: CONTEXT0_DATABASE_URL
              value: "postgres://{{ .Values.postgres.user }}:$(POSTGRES_PASSWORD)@postgres-age.{{ .Release.Namespace }}.svc.cluster.local:5432/{{ .Values.postgres.database }}?sslmode={{ .Values.postgres.sslMode }}&pool_max_conns={{ .Values.api.pool.maxConns }}&pool_min_conns={{ .Values.api.pool.minConns }}"
            - name: CONTEXT0_GRPC_PORT
              value: {{ .Values.api.grpcPort | quote }}
            - name: CONTEXT0_HTTP_PORT
              value: {{ .Values.api.httpPort | quote }}
            {{- if not .Values.auth.allowUnauthenticated }}
            - name: CONTEXT0_API_KEYS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.auth.existingSecret | default "context0-api-keys" }}
                  key: {{ .Values.auth.existingSecretKey | default "keys" }}
            {{- end }}
            # Enforced per replica, so the cluster-wide ceiling is roughly this
            # value times .Values.api.replicas.
            - name: CONTEXT0_RATE_LIMIT_PER_MINUTE
              value: {{ .Values.api.rateLimitPerMinute | quote }}
            - name: CONTEXT0_LOG_LEVEL
              value: {{ .Values.api.logLevel | quote }}
            - name: CONTEXT0_LOG_FORMAT
              value: {{ .Values.api.logFormat | quote }}
            # Go does not derive its heap target from the cgroup limit, so
            # without this the GC only reacts to its own pacing and the kernel
            # OOM-kills the container before the collector feels any pressure.
            {{- if .Values.api.resources.limits }}
            {{- if .Values.api.resources.limits.memory }}
            - name: GOMEMLIMIT
              valueFrom:
                resourceFieldRef:
                  containerName: context0-api
                  resource: limits.memory
            {{- end }}
            {{- end }}
          resources:
            {{- toYaml .Values.api.resources | nindent 12 }}
          # Three probes, three different questions.
          #
          # startup: covers InitSchema, which creates the AGE graph and its
          #   property indexes. Slow on a cold database, and it must not be
          #   mistaken for a hung process.
          startupProbe:
            httpGet:
              path: /startupz
              port: http
            periodSeconds: 2
            failureThreshold: 30
          # liveness: process-local only. It deliberately does NOT touch the
          #   database. A DB-dependent liveness probe fails on every replica at
          #   once during a failover, so Kubernetes restarts the whole fleet --
          #   which cannot fix a remote database and throws away every warm
          #   connection pool.
          livenessProbe:
            httpGet:
              path: /livez
              port: http
            periodSeconds: 10
            failureThreshold: 3
          # readiness: can this pod serve right now? Bounded DB ping plus the
          #   draining flag, so a terminating pod leaves the Service endpoints
          #   before it stops accepting connections.
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
            failureThreshold: 2
          lifecycle:
            preStop:
              exec:
                # Endpoint removal and container termination race each other:
                # kubelet sends SIGTERM at the same time the endpoints
                # controller starts propagating the removal. Without this pause
                # a proxy can still route to a socket that has already closed,
                # which shows up as connection-refused errors on every rollout.
                command: ["sleep", "{{ .Values.api.preStopSleepSeconds }}"]
          volumeMounts:
            # readOnlyRootFilesystem is on, so give the process a writable /tmp.
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: context0-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: context0-api
spec:
  # nodePort entries are only legal on a NodePort/LoadBalancer Service, so
  # enabling them implies the type. Reading service.type alone made
  # `--set service.nodePort.enabled=true` fail the install outright with
  # "may not be used when `type` is 'ClusterIP'".
  type: {{ if .Values.service.nodePort.enabled }}NodePort{{ else }}{{ .Values.service.type }}{{ end }}
  ports:
    - port: {{ .Values.api.grpcPort }}
      targetPort: {{ .Values.api.grpcPort }}
      name: grpc
      {{- if .Values.service.nodePort.enabled }}
      nodePort: {{ .Values.service.nodePort.grpc }}
      {{- end }}
    - port: {{ .Values.api.httpPort }}
      targetPort: {{ .Values.api.httpPort }}
      name: http
      {{- if .Values.service.nodePort.enabled }}
      nodePort: {{ .Values.service.nodePort.http }}
      {{- end }}
  selector:
    app: context0-api
{{- if gt (int .Values.api.replicas) 1 }}
---
# A PDB only makes sense with more than one replica: with replicas=1 a
# minAvailable of 1 would block every voluntary eviction, including node drains.
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: context0-api
  namespace: {{ .Release.Namespace }}
  labels:
    app: context0-api
spec:
  maxUnavailable: 1
  selector:
    matchLabels:
      app: context0-api
{{- end }}
