{{- if .Values.consolidation.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: context0-consolidation
  namespace: {{ .Release.Namespace }}
  labels:
    app: context0-consolidation
spec:
  schedule: {{ .Values.consolidation.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: context0-consolidation
        spec:
          restartPolicy: OnFailure
          containers:
            - name: consolidation
              image: "{{ .Values.api.image.repository }}:{{ .Values.api.image.tag }}"
              imagePullPolicy: {{ .Values.api.image.pullPolicy }}
              command: ["context0-consolidate"]
              env:
                - name: CONTEXT0_DATABASE_URL
                  value: "postgres://{{ .Values.postgres.user }}:{{ .Values.postgres.password }}@postgres-age.{{ .Release.Namespace }}.svc.cluster.local:5432/{{ .Values.postgres.database }}?sslmode=disable"
                - name: CONSOLIDATION_DECAY_HALF_LIFE_DAYS
                  value: {{ .Values.consolidation.decayHalfLifeDays | quote }}
                - name: CONSOLIDATION_STALE_THRESHOLD
                  value: {{ .Values.consolidation.staleThreshold | quote }}
                - name: CONSOLIDATION_PRUNE_AGE_DAYS
                  value: {{ .Values.consolidation.pruneAgeDays | quote }}
                - name: CONSOLIDATION_DRY_RUN
                  value: {{ .Values.consolidation.dryRun | quote }}
              resources:
                requests:
                  memory: "128Mi"
                  cpu: "100m"
                limits:
                  memory: "256Mi"
                  cpu: "250m"
{{- end }}
