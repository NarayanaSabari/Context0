# golangci-lint v2 configuration.
#
# The CI workflow installs golangci-lint at "latest", which moved to v2 and
# rejects the v1 schema outright, so this file tracks the v2 format.
version: "2"

run:
  tests: true

linters:
  # These five are golangci-lint's defaults; listing them explicitly keeps the
  # enabled set visible rather than implied by the tool's version.
  default: none
  enable:
    - errcheck
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    errcheck:
      exclude-functions:
        - fmt.Fprintf
        - (io.Closer).Close

  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      # Tests favour readability over checking every teardown error.
      - linters:
          - errcheck
        path: _test\.go
      # The CLI writes to stdout, where a failed write is not actionable.
      - linters:
          - errcheck
        path: cmd/cli/
    paths:
      - api/gen

formatters:
  enable:
    - gofmt
