name: Security Scan

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # Every Monday at 6am UTC
  workflow_dispatch: # Allow manual trigger

permissions:
  contents: read
  security-events: write

jobs:
  gosec:
    name: Go Security
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      # -exclude-dir=api/gen skips protoc-gen-go's output.
      #
      # That code accounts for every remaining finding, all of them G103
      # ("use of unsafe calls should be audited") on the unsafe.Slice /
      # unsafe.StringData pattern the protobuf runtime uses to expose raw
      # descriptors without copying. It is generated by protoc-gen-go, is
      # regenerated from the .proto files on every change, and hand-editing it
      # is a mistake - so a finding there is not something a contributor can
      # act on, and a permanently red job teaches everyone to ignore the
      # results.
      #
      # Nothing hand-written is excluded: the scan is clean across the other 29
      # files, and this step fails the build if that stops being true.
      - name: gosec
        uses: securego/gosec@master
        with:
          args: "-exclude-dir=api/gen -fmt sarif -out gosec.sarif ./..."

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: gosec.sarif

  trivy:
    name: Container Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build images
        run: |
          docker build -t kora/kora:scan .
          docker build -t kora/postgres-age-vector:scan ./docker/postgres-age-vector/

      - name: Scan API image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: kora/kora:scan
          format: sarif
          output: trivy-api.sarif
          severity: CRITICAL,HIGH

      - name: Scan Postgres image
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: kora/postgres-age-vector:scan
          format: sarif
          output: trivy-pg.sarif
          severity: CRITICAL,HIGH

      - name: Upload API SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-api.sarif
          category: trivy-api

      - name: Upload PG SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-pg.sarif
          category: trivy-postgres

  dependency-review:
    name: Dependency Review
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
