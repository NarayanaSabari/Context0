name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}/kora

jobs:
  # ── Validate ──────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run tests
        run: go test ./... -race -count=1

      - name: Build check
        run: go build ./...

  # ── Build & Push Docker Images ────────────────────────
  docker:
    name: Docker Images
    runs-on: ubuntu-latest
    needs: [validate]
    strategy:
      matrix:
        include:
          - image: kora-server
            dockerfile: Dockerfile
            context: .
          - image: kora-postgres
            dockerfile: docker/postgres-age-vector/Dockerfile
            context: docker/postgres-age-vector
          - image: kora-web
            dockerfile: web/Dockerfile
            context: web
    steps:
      - uses: actions/checkout@v4

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build CLI Binaries ────────────────────────────────
  binaries:
    name: CLI Binaries
    runs-on: ubuntu-latest
    needs: [validate]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          go build -ldflags "-s -w -X github.com/NarayanaSabari/Kora/internal/config.DefaultVersion=$VERSION" \
            -o kora-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/cli

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: kora-${{ matrix.goos }}-${{ matrix.goarch }}
          path: kora-*

  # ── Helm Chart ────────────────────────────────────────
  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Package chart
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          helm package ./charts/kora --version $VERSION --app-version $VERSION

      - name: Push chart
        run: |
          VERSION=${GITHUB_REF_NAME#v}
          helm push kora-${VERSION}.tgz oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

  # ── Python SDK ────────────────────────────────────────
  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build package
        working-directory: sdk/python
        run: |
          pip install build
          python -m build

      - name: Upload dist
        uses: actions/upload-artifact@v4
        with:
          name: python-sdk
          path: sdk/python/dist/

      # Uncomment when PyPI token is configured:
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     packages-dir: sdk/python/dist/

  # ── GitHub Release ────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [docker, binaries, helm, python-sdk]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          pattern: kora-*
          path: release-assets/
          merge-multiple: true

      - name: Download Python SDK
        uses: actions/download-artifact@v4
        with:
          name: python-sdk
          path: release-assets/

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --no-merges)
          else
            COMMITS=$(git log --oneline --no-merges ${PREV_TAG}..HEAD)
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.commits }}

            ## Install

            **Helm:**
            ```bash
            helm install kora oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/kora --version ${{ github.ref_name }}
            ```

            **Docker:**
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/kora-server:${{ github.ref_name }}
            ```

            **CLI:**
            Download the binary for your platform from the assets below.

            **Python SDK:**
            ```bash
            pip install kora==${{ github.ref_name }}
            ```
