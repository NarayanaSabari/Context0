name: Release

on:
  push:
    tags:
      - "v*.*.*"
  # Dry run. Everything except tagging is reachable this way, so a change to
  # this workflow -- an action major bump, most often -- can be exercised
  # before it is needed, rather than discovered during a release when the only
  # way to retry is another tag.
  #
  # Nothing publishes on this path: images build without pushing, the chart is
  # packaged but not pushed, and the GitHub Release step is skipped. The
  # version comes from the input instead of the tag name.
  workflow_dispatch:
    inputs:
      version:
        description: "Version to build as, without the leading v (dry run only)"
        required: false
        default: "0.0.0-dryrun"

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io
  # "true" on a manual dispatch, "false" on a tag push. Every publishing step
  # is gated on this.
  DRY_RUN: ${{ github.event_name == 'workflow_dispatch' }}
  # The tag drives the version on a real release; the input drives it on a dry
  # run, where github.ref_name is a branch and would produce a bad version.
  VERSION: ${{ github.event_name == 'workflow_dispatch' && inputs.version || '' }}

jobs:
  # ── Validate ──────────────────────────────────────────
  validate:
    name: Validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Run tests
        run: go test ./... -race -count=1

      - name: Build check
        run: go build ./...

  # ── Build & Push Docker Images ────────────────────────
  docker:
    name: Docker Images
    runs-on: ubuntu-latest
    needs: [validate]
    strategy:
      matrix:
        include:
          - image: kora-server
            dockerfile: Dockerfile
            context: .
          - image: kora-postgres
            dockerfile: docker/postgres-age-vector/Dockerfile
            context: docker/postgres-age-vector
          - image: kora-web
            dockerfile: web/Dockerfile
            context: web
    steps:
      - uses: actions/checkout@v7

      - name: Docker meta
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository_owner }}/${{ matrix.image }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable={{is_default_branch}}
            # A dispatch runs on a branch, where the semver patterns above
            # produce nothing and the build step would have no tag to apply.
            # This one only appears on a dry run, and is never pushed.
            type=raw,value=${{ inputs.version }},enable=${{ github.event_name == 'workflow_dispatch' }}

      - name: Login to GHCR
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          # A dry run builds both platforms and exercises the action, but
          # publishes nothing.
          push: ${{ env.DRY_RUN != 'true' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── Build CLI Binaries ────────────────────────────────
  binaries:
    name: CLI Binaries
    runs-on: ubuntu-latest
    needs: [validate]
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
            ext: .exe
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          VERSION=${VERSION:-${GITHUB_REF_NAME#v}}
          go build -ldflags "-s -w -X github.com/NarayanaSabari/Kora/internal/config.DefaultVersion=$VERSION" \
            -o kora-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.ext }} ./cmd/cli

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: kora-${{ matrix.goos }}-${{ matrix.goarch }}
          path: kora-*

  # ── Helm Chart ────────────────────────────────────────
  helm:
    name: Helm Chart
    runs-on: ubuntu-latest
    needs: [validate]
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Install Helm
        uses: azure/setup-helm@v5

      - name: Login to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} --username ${{ github.actor }} --password-stdin

      - name: Package chart
        run: |
          VERSION=${VERSION:-${GITHUB_REF_NAME#v}}
          helm package ./charts/kora --version "$VERSION" --app-version "$VERSION"

      - name: Push chart
        if: env.DRY_RUN != 'true'
        run: |
          VERSION=${VERSION:-${GITHUB_REF_NAME#v}}
          helm push "kora-${VERSION}.tgz" oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

  # ── Python SDK ────────────────────────────────────────
  python-sdk:
    name: Python SDK
    runs-on: ubuntu-latest
    needs: [validate]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Build package
        working-directory: sdk/python
        run: |
          pip install build
          python -m build

      - name: Upload dist
        uses: actions/upload-artifact@v7
        with:
          name: python-sdk
          path: sdk/python/dist/

      # Uncomment when PyPI token is configured:
      # - name: Publish to PyPI
      #   uses: pypa/gh-action-pypi-publish@release/v1
      #   with:
      #     packages-dir: sdk/python/dist/

  # ── GitHub Release ────────────────────────────────────
  release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: [docker, binaries, helm, python-sdk]
    # A dry run stops here. Everything above it has already run, which is the
    # point: the jobs that build and package are exercised, and only the step
    # that would create a public release is skipped.
    if: github.event_name != 'workflow_dispatch'
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Download binaries
        uses: actions/download-artifact@v8
        with:
          pattern: kora-*
          path: release-assets/
          merge-multiple: true

      - name: Download Python SDK
        uses: actions/download-artifact@v8
        with:
          name: python-sdk
          path: release-assets/

      - name: Generate checksums
        working-directory: release-assets
        run: sha256sum * > SHA256SUMS

      - name: Generate changelog
        id: changelog
        run: |
          # Get commits since last tag
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then
            COMMITS=$(git log --oneline --no-merges)
          else
            COMMITS=$(git log --oneline --no-merges ${PREV_TAG}..HEAD)
          fi
          echo "commits<<EOF" >> $GITHUB_OUTPUT
          echo "$COMMITS" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: release-assets/*
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.commits }}

            ## Install

            **Helm:**
            ```bash
            helm install kora oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/kora --version ${{ github.ref_name }}
            ```

            **Docker:**
            ```bash
            docker pull ${{ env.REGISTRY }}/${{ github.repository_owner }}/kora-server:${{ github.ref_name }}
            ```

            **CLI:**
            Download the binary for your platform from the assets below.

            **Python SDK:**
            ```bash
            pip install kora==${{ github.ref_name }}
            ```
