name: Site

# Verification runs here; hosting is Cloudflare Pages.
#
# The split is deliberate. GitHub Actions is where the five checks live,
# because they need three browser engines and take a couple of minutes -
# work a CDN build step should not be doing. Cloudflare builds and serves
# the site, because it already terminates TLS for this domain and issues
# certificates in seconds rather than the tens of minutes GitHub Pages took.
#
# Deployment is a push, not a pull: this workflow uploads the built site to
# Cloudflare only after the checks pass. Cloudflare's own git integration is
# deliberately left disconnected, so nothing reaches production without
# passing through here first.

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yaml"
  pull_request:
    branches: [main]
    paths:
      - "site/**"
      - ".github/workflows/site.yaml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: site-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: site
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Typecheck
        working-directory: site
        run: pnpm tsc --noEmit

      - name: Build
        working-directory: site
        run: pnpm build

      - name: Check built output
        working-directory: site
        run: node scripts/check-build.mjs

      # The docs are docsify: Markdown fetched and rendered in the browser
      # rather than built. So the build cannot tell whether a sidebar entry
      # points at a file that exists, whether the vendored runtime was copied,
      # or whether something crept back onto a CDN that the CSP will block in
      # production only.
      - name: Check the docs
        working-directory: site
        run: node scripts/check-docs.mjs

      - name: Install browsers
        working-directory: site
        run: pnpm exec playwright install --with-deps chromium webkit firefox

      - name: Verify in a browser
        working-directory: site
        run: node scripts/verify-site.mjs

      # The checks that only fail for a subset of visitors: scripts blocked,
      # a keyboard instead of a mouse, reduced motion, low contrast.
      - name: Accessibility and no-JS audit
        working-directory: site
        run: node scripts/audit.mjs

      # Safari and Firefox render differently, and webfonts arrive late on a
      # real network. Neither shows up in a local Chromium screenshot.
      - name: WebKit, Firefox, and layout stability
        working-directory: site
        run: node scripts/cross-browser.mjs

      # The waitlist is the only thing on this site that does anything. These
      # drive it against a stubbed provider that is slow, down, or rejecting,
      # and assert it never claims success for an address that went nowhere.
      - name: Waitlist failure modes
        working-directory: site
        run: node scripts/waitlist.mjs

      # Hand the verified build to the deploy job rather than rebuilding it,
      # so what ships is byte-for-byte what was checked.
      - name: Upload verified build
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: site/dist
          retention-days: 1

  deploy:
    name: Deploy
    # A pull request must never publish to the live domain.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://kora.sabarinarayana.com
    steps:
      - uses: actions/checkout@v4

      - name: Download verified build
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: site/dist

      # --project-name is the Cloudflare Pages project ID, not the product
      # name. It stays "context0" after the rename to kora because renaming a
      # Pages project is not possible in place: it would mean creating a new
      # project, re-attaching the custom domain, and re-issuing the
      # certificate, with the site down in between. The project serves
      # kora.sabarinarayana.com; only the internal identifier is historical.
      - name: Deploy to Cloudflare Pages
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy site/dist --project-name=context0 --branch=main
