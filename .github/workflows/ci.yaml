name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Lint ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        # Pinned deliberately. The action major version and the linter major
        # version must agree: v6 installs golangci-lint v1, which rejects the
        # v2 .golangci.yml schema outright. "latest" for the linter is also
        # avoided so a future major bump breaks on a version bump we control
        # rather than on an unrelated PR.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-mode: goinstall

      - name: Proto lint (buf)
        uses: bufbuild/buf-setup-action@v1
      - run: buf lint api/proto

      - name: Web lint
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm tsc --noEmit

  # ── Unit Tests ────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Run tests
        run: |
          go test $(go list ./... | grep -v /api/gen/) \
            -race -cover -coverprofile=coverage.out -count=1

      - name: Coverage report
        run: |
          echo "=== Coverage by package ==="
          go tool cover -func=coverage.out
          echo ""
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage.out

  # ── Integration Tests ─────────────────────────────────
  # The graph repository writes Cypher by hand, so its tests run against a real
  # Apache AGE instance. A query can be valid Go and malformed openCypher, and
  # only the real parser catches that.
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Start PostgreSQL + AGE + pgvector
        run: |
          docker compose up -d postgres
          for _ in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U context0 >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "postgres did not become ready"; docker compose logs postgres; exit 1

      - name: Run graph integration tests
        env:
          CONTEXT0_TEST_DATABASE_URL: postgres://context0:context0@localhost:5432/context0?sslmode=disable
        run: go test ./internal/graph/... -race -count=1 -v

      - name: Stop services
        if: always()
        run: docker compose down -v

  # ── Build ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build Go binaries
        run: |
          CGO_ENABLED=0 go build -o bin/context0-server ./cmd/server
          CGO_ENABLED=0 go build -o bin/context0-consolidate ./cmd/consolidate
          CGO_ENABLED=0 go build -o bin/context0 ./cmd/cli

      - name: Build API Docker image
        run: docker build -t context0/context0:ci .

      - name: Build Postgres+AGE+pgvector image
        run: docker build -t context0/postgres-age-vector:ci ./docker/postgres-age-vector/

      - name: Build Web UI
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build Web Docker image
        run: docker build -t context0/web:ci ./web/

      - name: Helm lint
        run: |
          # Credentials must be supplied: the chart ships no default password or
          # API key, because a default in a public chart is a published
          # credential.
          helm lint ./charts/context0 \
            --set postgres.password=ci-render-only \
            --set auth.apiKeys=ctx0_ci_render_only
          helm template context0 ./charts/context0 \
            --set postgres.password=ci-render-only \
            --set auth.apiKeys=ctx0_ci_render_only > /dev/null

          # The other supported path: bring your own Secrets, chart creates none.
          helm template context0 ./charts/context0 \
            --set postgres.existingSecret=my-pg \
            --set auth.existingSecret=my-keys > /dev/null

          # And the guard itself must hold: a credential-less install has to
          # fail loudly rather than quietly shipping an empty password.
          if helm template context0 ./charts/context0 > /dev/null 2>&1; then
            echo "::error::chart rendered without credentials; the required-value guard is gone"
            exit 1
          fi

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: binaries
          path: bin/

  # ── E2E Tests (main only) ────────────────────────────
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    needs: [build]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: context0-e2e

      - name: Build and load images
        run: |
          docker build -t context0/context0:ci .
          docker build -t context0/postgres-age-vector:ci ./docker/postgres-age-vector/
          kind load docker-image context0/context0:ci --name context0-e2e
          kind load docker-image context0/postgres-age-vector:ci --name context0-e2e

      # Runs the install paths the README and Makefile document, from scratch,
      # rather than the bespoke one below. Removing the chart's default
      # credentials broke every documented path and nothing noticed for several
      # commits: the unit tests, the 64 cluster checks and the soak all start
      # from a deployment that is already up.
      - name: Verify documented install paths
        env:
          # CI tags images :ci; the script defaults to the local dev tags.
          API_IMAGE_REPO: context0/context0
          API_IMAGE_TAG: ci
          PG_IMAGE_REPO: context0/postgres-age-vector
          PG_IMAGE_TAG: ci
        run: scripts/verify_install.sh

      - name: Deploy
        run: |
          # Generated per run rather than hardcoded: the chart ships no default
          # credentials, and a fixed key in a public workflow is a published one
          # even when it only ever reaches an ephemeral cluster.
          echo "E2E_API_KEY=ctx0_$(openssl rand -hex 6)_$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "E2E_PG_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          source "$GITHUB_ENV"

          helm install context0 ./charts/context0 -n context0 --create-namespace \
            --set api.image.tag=ci \
            --set api.image.repository=context0/context0 \
            --set postgres.image.tag=ci \
            --set web.enabled=false \
            --set postgres.password="$E2E_PG_PASSWORD" \
            --set auth.apiKeys="$E2E_API_KEY"

          kubectl -n context0 wait --for=condition=ready pod -l app=postgres-age --timeout=120s
          kubectl -n context0 wait --for=condition=ready pod -l app=context0-api --timeout=120s

      - name: Port forward
        run: |
          kubectl -n context0 port-forward svc/context0-api 8080:8080 &
          sleep 5
          curl -sf http://localhost:8080/v1/health

      # Structural performance guarantees: that the indexes can serve the
      # queries, that the rate limit and buckets are configured usefully. The
      # latency thresholds report but do not enforce here, because a CI database
      # holds a few rows and everything is fast at that size -- a pass would be
      # evidence of nothing. Run this against a loaded cluster for the timings.
      - name: Verify performance invariants
        env:
          CONTEXT0_API_KEY: ${{ env.E2E_API_KEY }}
        run: scripts/verify_perf.sh

      - name: Run E2E tests
        env:
          CONTEXT0_E2E_HTTP: http://localhost:8080
          CONTEXT0_E2E_API_KEY: ${{ env.E2E_API_KEY }}
        run: go test ./test/e2e/... -v -tags=e2e -count=1 -timeout=120s
