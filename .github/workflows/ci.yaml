name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # ── Lint ──────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Go vet
        run: go vet ./...

      - name: golangci-lint
        # Pinned deliberately. The action major version and the linter major
        # version must agree: v6 installs golangci-lint v1, which rejects the
        # v2 .golangci.yml schema outright. "latest" for the linter is also
        # avoided so a future major bump breaks on a version bump we control
        # rather than on an unrelated PR.
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2
          install-mode: goinstall

      - name: Proto lint (buf)
        uses: bufbuild/buf-setup-action@v1
        with:
          # Without a token this action calls the GitHub API anonymously to
          # resolve the download URL, and warns as much. Anonymous requests
          # are rate limited per runner IP, and once the limit is hit the API
          # returns an HTML error page that the action tries to parse as a
          # release, failing with a raw "<!DOCTYPE html>". It looks like a
          # proto lint error and is not one.
          #
          # This became routine rather than rare once Dependabot began opening
          # PRs: several runs a day, each resolving the same download, share
          # that per-IP budget.
          github_token: ${{ secrets.GITHUB_TOKEN }}
      - run: buf lint api/proto

      # The published docs at /docs/ are a separate set from the Markdown in
      # this repo, and nothing checked them against the code. A documented
      # KORA_* variable that no longer exists does not error when a user sets
      # it -- the engine falls back to its default and ignores them -- and
      # Helm accepts a --set path that no chart value matches. Both fail
      # silently, which is why this compares the docs to the code rather than
      # to each other.
      - name: Docs describe settings that exist
        run: bash scripts/verify_docs.sh

      - name: Web lint
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm tsc --noEmit

  # ── Unit Tests ────────────────────────────────────────
  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Run tests
        run: |
          go test $(go list ./... | grep -v /api/gen/) \
            -race -cover -coverprofile=coverage.out -count=1

      - name: Coverage report
        run: |
          echo "=== Coverage by package ==="
          go tool cover -func=coverage.out
          echo ""
          go tool cover -func=coverage.out | tail -1

      - name: Upload coverage
        uses: actions/upload-artifact@v7
        with:
          name: coverage
          path: coverage.out

  # ── Integration Tests ─────────────────────────────────
  # The graph repository writes Cypher by hand, so its tests run against a real
  # Apache AGE instance. A query can be valid Go and malformed openCypher, and
  # only the real parser catches that.
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      # docker-compose requires credentials to be supplied rather than shipping
      # defaults, so generate them per run. A fixed value in a public workflow
      # is a published credential even when it only reaches an ephemeral runner.
      - name: Generate compose credentials
        run: |
          {
            echo "POSTGRES_PASSWORD=$(openssl rand -hex 16)"
            echo "KORA_API_KEYS=ctx0_$(openssl rand -hex 6)_$(openssl rand -hex 24)"
          } > .env
          # Exported for the test DSN below, which must match.
          grep POSTGRES_PASSWORD .env >> "$GITHUB_ENV"

      - name: Start PostgreSQL + AGE + pgvector
        run: |
          docker compose up -d postgres
          for _ in $(seq 1 60); do
            if docker compose exec -T postgres pg_isready -U kora >/dev/null 2>&1; then
              echo "postgres ready"; exit 0
            fi
            sleep 2
          done
          echo "postgres did not become ready"; docker compose logs postgres; exit 1

      - name: Run graph integration tests
        env:
          KORA_TEST_DATABASE_URL: postgres://kora:${{ env.POSTGRES_PASSWORD }}@localhost:5432/kora?sslmode=disable
        run: go test ./internal/graph/... -race -count=1 -v

      - name: Stop services
        if: always()
        run: docker compose down -v

  # ── Build ─────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Build Go binaries
        run: |
          CGO_ENABLED=0 go build -o bin/kora-server ./cmd/server
          CGO_ENABLED=0 go build -o bin/kora-consolidate ./cmd/consolidate
          CGO_ENABLED=0 go build -o bin/kora ./cmd/cli

      - name: Build API Docker image
        run: docker build -t kora/kora:ci .

      - name: Build Postgres+AGE+pgvector image
        run: docker build -t kora/postgres-age-vector:ci ./docker/postgres-age-vector/

      - name: Build Web UI
        working-directory: web
        run: |
          corepack enable
          pnpm install --frozen-lockfile
          pnpm build

      - name: Build Web Docker image
        run: docker build -t kora/web:ci ./web/

      - name: Helm lint
        run: |
          # Credentials must be supplied: the chart ships no default password or
          # API key, because a default in a public chart is a published
          # credential.
          helm lint ./charts/kora \
            --set postgres.password=ci-render-only \
            --set auth.apiKeys=ctx0_ci_render_only
          helm template kora ./charts/kora \
            --set postgres.password=ci-render-only \
            --set auth.apiKeys=ctx0_ci_render_only > /dev/null

          # The other supported path: bring your own Secrets, chart creates none.
          helm template kora ./charts/kora \
            --set postgres.existingSecret=my-pg \
            --set auth.existingSecret=my-keys > /dev/null

          # And the guard itself must hold: a credential-less install has to
          # fail loudly rather than quietly shipping an empty password.
          if helm template kora ./charts/kora > /dev/null 2>&1; then
            echo "::error::chart rendered without credentials; the required-value guard is gone"
            exit 1
          fi

          creds=(--set postgres.password=ci-render-only --set auth.apiKeys=ctx0_ci_render_only)

          # /dev/shm is tmpfs and counts against the container memory limit --
          # measured on a live pod, writing 100MB into /dev/shm moved cgroup
          # memory.current by exactly 100Mi. A shmSize at or above the limit
          # means the pod can be OOM-killed by filling shared memory alone.
          # An earlier revision of this chart shipped 256Mi of shm plus 320MB
          # of shared_buffers inside a 1Gi limit and was OOM-killable at rest.
          for combo in "8Gi:1Gi" "2Gi:2Gi" "1G:512M"; do
            shm="${combo%%:*}"; lim="${combo##*:}"
            if helm template kora ./charts/kora "${creds[@]}" \
                 --set postgres.shmSize="$shm" \
                 --set postgres.resources.limits.memory="$lim" > /dev/null 2>&1; then
              echo "::error::chart accepted shmSize=$shm with limits.memory=$lim; that pod is OOM-killable by filling /dev/shm alone"
              exit 1
            fi
          done

          # ...and sane combinations must still render, in mixed units, or the
          # guard above is just breaking the chart.
          for combo in "256Mi:2Gi" "512Mi:2Gi" "128Mi:512Mi" "256M:2G"; do
            shm="${combo%%:*}"; lim="${combo##*:}"
            helm template kora ./charts/kora "${creds[@]}" \
              --set postgres.shmSize="$shm" \
              --set postgres.resources.limits.memory="$lim" > /dev/null
          done

          # A PodDisruptionBudget only makes sense above one replica: at
          # replicas=1 it would block every voluntary eviction, including node
          # drains.
          if helm template kora ./charts/kora "${creds[@]}" --set api.replicas=1 \
               | grep -q "kind: PodDisruptionBudget"; then
            echo "::error::a PDB renders at replicas=1, which blocks node drains"
            exit 1
          fi
          for n in 2 3; do
            helm template kora ./charts/kora "${creds[@]}" --set api.replicas=$n \
              | grep -q "kind: PodDisruptionBudget" || {
                echo "::error::no PodDisruptionBudget at replicas=$n"; exit 1; }
          done

          # Tuning values have to actually reach the container. A renamed key
          # would leave the default in place silently, which is how a
          # performance setting stops being applied without anyone noticing.
          helm template kora ./charts/kora "${creds[@]}" \
            --set postgres.tuning.sharedBuffers=999MB \
            | grep -q -- "- shared_buffers=999MB" || {
              echo "::error::postgres.tuning.sharedBuffers does not reach the container"; exit 1; }

          # The consolidation job deletes memories, so its thresholds reaching
          # the CronJob is not cosmetic.
          helm template kora ./charts/kora "${creds[@]}" \
            --set consolidation.pruneAgeDays=77 \
            | grep -A1 "CONSOLIDATION_PRUNE_AGE_DAYS" | grep -q '"77"' || {
              echo "::error::consolidation.pruneAgeDays does not reach the CronJob"; exit 1; }

      - name: Upload binaries
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: bin/

  # ── E2E Tests ─────────────────────────────────────────
  #
  # Runs on pull requests as well as main. It was main-only, which had two
  # consequences worth stating: a change could only fail here after it had
  # already merged, and "E2E Tests" as a required status check was satisfied by
  # being skipped -- protection that looked present and was not.
  #
  # It is the most expensive job at roughly eight minutes, because it stands up
  # a kind cluster, deploys the chart, and drives the CLI, the Python SDK, and
  # the MCP server against a live engine. That is also why it is worth waiting
  # for: it is the only job that would notice the deployment path breaking.
  e2e:
    name: E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: "1.26"

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: kora-e2e

      - name: Build and load images
        run: |
          docker build -t kora/kora:ci .
          docker build -t kora/postgres-age-vector:ci ./docker/postgres-age-vector/
          kind load docker-image kora/kora:ci --name kora-e2e
          kind load docker-image kora/postgres-age-vector:ci --name kora-e2e

      # Runs the install paths the README and Makefile document, from scratch,
      # rather than the bespoke one below. Removing the chart's default
      # credentials broke every documented path and nothing noticed for several
      # commits: the unit tests, the 64 cluster checks and the soak all start
      # from a deployment that is already up.
      - name: Verify documented install paths
        env:
          # CI tags images :ci; the script defaults to the local dev tags.
          API_IMAGE_REPO: kora/kora
          API_IMAGE_TAG: ci
          PG_IMAGE_REPO: kora/postgres-age-vector
          PG_IMAGE_TAG: ci
        run: scripts/verify_install.sh

      - name: Deploy
        run: |
          # Generated per run rather than hardcoded: the chart ships no default
          # credentials, and a fixed key in a public workflow is a published one
          # even when it only ever reaches an ephemeral cluster.
          echo "E2E_API_KEY=ctx0_$(openssl rand -hex 6)_$(openssl rand -hex 24)" >> "$GITHUB_ENV"
          echo "E2E_PG_PASSWORD=$(openssl rand -hex 16)" >> "$GITHUB_ENV"
          source "$GITHUB_ENV"

          helm install kora ./charts/kora -n kora --create-namespace \
            --set api.image.tag=ci \
            --set api.image.repository=kora/kora \
            --set postgres.image.tag=ci \
            --set web.enabled=false \
            --set postgres.password="$E2E_PG_PASSWORD" \
            --set auth.apiKeys="$E2E_API_KEY"

          kubectl -n kora wait --for=condition=ready pod -l app=postgres-age --timeout=120s
          kubectl -n kora wait --for=condition=ready pod -l app=kora-api --timeout=120s

      - name: Port forward
        run: |
          kubectl -n kora port-forward svc/kora-api 8080:8080 &
          sleep 5
          curl -sf http://localhost:8080/v1/health

      # Seeds enough data for the latency thresholds to mean something. Without
      # this the CI database holds a handful of rows, everything is fast
      # regardless, and a green run would say nothing about performance -- which
      # is exactly the kind of check that looks like coverage and is not.
      - name: Seed data for performance measurement
        env:
          KORA_API_KEY: ${{ env.E2E_API_KEY }}
        run: |
          kubectl -n kora port-forward svc/kora-api 8080:8080 &
          sleep 5
          python3 scripts/soak.py --url http://localhost:8080 \
            --key "$KORA_API_KEY" --workers 4 --minutes 2 || true

      # Structural guarantees (index capability, rate limit, buckets, pool
      # metrics) plus the latency thresholds, which enforce once the seeding
      # above has put enough rows in the database.
      - name: Verify performance invariants
        env:
          KORA_API_KEY: ${{ env.E2E_API_KEY }}
          # The seed run is bounded by CI time, so it will not reach the volume
          # a real deployment has. Lowered to match what two minutes produces,
          # while still being far more than "a handful of rows".
          MIN_VERTICES_FOR_LATENCY: "2000"
        run: scripts/verify_perf.sh

      # The CLI's argument handling is covered by unit tests against an
      # unreachable endpoint, which cannot exercise the success path: forcing
      # every RPC error branch to fire left that suite green, because from its
      # view each call already failed. These run against the live engine.
      - name: Run CLI tests against the live engine
        env:
          KORA_CLI_ENDPOINT: localhost:50051
          KORA_API_KEY: ${{ env.E2E_API_KEY }}
        run: |
          # The CLI speaks gRPC, and the other steps only forward the HTTP
          # port, so this needs its own forward.
          kubectl -n kora port-forward svc/kora-api 50051:50051 &
          sleep 5
          go test ./cmd/cli/ -run Live -count=1 -v

      # The Python SDK is a published interface with no coverage: a route
      # table and per-field response parsing that renames everything on the
      # way in. A broken route or a renamed field would reach users with
      # nothing to catch it.
      - name: Run Python SDK E2E tests
        env:
          KORA_ENDPOINT: localhost:8080
          KORA_API_KEY: ${{ env.E2E_API_KEY }}
        run: python3 sdk/python/tests/test_e2e.py

      # The MCP server is the same shape of risk as the SDK above, and shipped
      # with no coverage at all: its own route table, its own field parsing,
      # and a mapping from human words ("semantic") to wire enum values that
      # nothing checked. It is what an editor talks to, so a break here is
      # invisible until an agent silently stops remembering things.
      - name: Run MCP server E2E tests
        env:
          KORA_HTTP_URL: http://localhost:8080
          KORA_API_KEY: ${{ env.E2E_API_KEY }}
        run: |
          pip install --quiet ./mcp-server
          python3 mcp-server/tests/test_e2e.py

      - name: Run E2E tests
        env:
          KORA_E2E_HTTP: http://localhost:8080
          KORA_E2E_API_KEY: ${{ env.E2E_API_KEY }}
        run: go test ./test/e2e/... -v -tags=e2e -count=1 -timeout=120s
