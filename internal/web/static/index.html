<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context0 — Memory Graph</title>
  <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12131a;
      --surface2: #1a1b26;
      --border: #262836;
      --text: #e1e2e8;
      --text-muted: #6b6e82;
      --accent: #7aa2f7;
      --green: #9ece6a;
      --orange: #e0af68;
      --purple: #bb9af7;
      --red: #f7768e;
      --cyan: #7dcfff;
      --radius: 10px;
    }
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--text);
      height: 100vh; display: flex; flex-direction: column;
      overflow: hidden;
    }

    /* ---- Header ---- */
    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 14px 28px;
      display: flex; align-items: center; justify-content: space-between;
      flex-shrink: 0;
    }
    .logo { font-size: 17px; font-weight: 700; letter-spacing: -0.3px; }
    .logo span { color: var(--accent); }
    .header-stats {
      display: flex; gap: 20px; font-size: 12px; color: var(--text-muted);
    }
    .header-stats b { color: var(--text); font-weight: 600; }

    /* ---- Layout ---- */
    .main { display: flex; flex: 1; overflow: hidden; }

    /* ---- Sidebar ---- */
    .sidebar {
      width: 380px; background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column; flex-shrink: 0;
    }
    .sidebar-section {
      padding: 16px 20px; border-bottom: 1px solid var(--border);
    }
    .sidebar-section h3 {
      font-size: 11px; font-weight: 600; text-transform: uppercase;
      letter-spacing: 1px; color: var(--text-muted); margin-bottom: 10px;
    }
    .key-input {
      width: 100%; padding: 9px 12px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-size: 13px; font-family: monospace; outline: none;
    }
    .key-input:focus { border-color: var(--accent); }
    .key-input::placeholder { color: var(--text-muted); }

    .search-input {
      width: 100%; padding: 9px 12px;
      background: var(--bg); border: 1px solid var(--border);
      border-radius: var(--radius); color: var(--text);
      font-size: 13px; outline: none;
    }
    .search-input:focus { border-color: var(--accent); }

    .type-filters {
      display: flex; gap: 6px; margin-top: 10px;
    }
    .type-pill {
      padding: 5px 12px; font-size: 11px; font-weight: 600;
      border: 1px solid var(--border); border-radius: 20px;
      background: transparent; color: var(--text-muted);
      cursor: pointer; transition: all 0.15s;
    }
    .type-pill.active { color: #fff; }
    .type-pill.active[data-type="all"] { background: var(--accent); border-color: var(--accent); }
    .type-pill.active[data-type="semantic"] { background: var(--green); border-color: var(--green); color: #000; }
    .type-pill.active[data-type="episodic"] { background: var(--orange); border-color: var(--orange); color: #000; }
    .type-pill.active[data-type="procedural"] { background: var(--purple); border-color: var(--purple); color: #000; }
    .type-pill:hover:not(.active) { border-color: var(--text-muted); }

    /* ---- Memory List ---- */
    .memory-list { flex: 1; overflow-y: auto; padding: 8px 12px; }
    .mem-card {
      padding: 12px 14px; border-radius: var(--radius);
      cursor: pointer; margin-bottom: 4px; transition: all 0.15s;
      border: 1px solid transparent;
    }
    .mem-card:hover { background: var(--surface2); border-color: var(--border); }
    .mem-card.selected { background: rgba(122, 162, 247, 0.1); border-color: var(--accent); }
    .mem-card .badge {
      display: inline-block; padding: 2px 8px; border-radius: 6px;
      font-size: 10px; font-weight: 700; text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .badge-semantic { background: rgba(158, 206, 106, 0.15); color: var(--green); }
    .badge-episodic { background: rgba(224, 175, 104, 0.15); color: var(--orange); }
    .badge-procedural { background: rgba(187, 154, 247, 0.15); color: var(--purple); }
    .mem-card .text {
      font-size: 13px; line-height: 1.45; margin-top: 6px;
      display: -webkit-box; -webkit-line-clamp: 2;
      -webkit-box-orient: vertical; overflow: hidden;
    }
    .mem-card .sub {
      font-size: 11px; color: var(--text-muted); margin-top: 5px;
      display: flex; gap: 10px;
    }

    /* ---- Graph Area ---- */
    .graph-area { flex: 1; position: relative; background: var(--bg); }
    #cy { width: 100%; height: 100%; }

    /* ---- Legend ---- */
    .legend {
      position: absolute; bottom: 20px; left: 20px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 14px 18px;
      font-size: 12px;
    }
    .legend h4 {
      font-size: 10px; text-transform: uppercase; letter-spacing: 1px;
      color: var(--text-muted); margin-bottom: 8px;
    }
    .legend-row {
      display: flex; align-items: center; gap: 8px; margin-bottom: 4px;
    }
    .legend-dot {
      width: 12px; height: 12px; border-radius: 50%; flex-shrink: 0;
    }
    .legend-line {
      width: 20px; height: 2px; flex-shrink: 0; border-radius: 1px;
    }

    /* ---- Detail Panel ---- */
    .detail {
      position: absolute; top: 20px; right: 20px; width: 340px;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 20px;
      display: none; max-height: calc(100% - 40px); overflow-y: auto;
    }
    .detail.show { display: block; }
    .detail-close {
      position: absolute; top: 12px; right: 14px;
      background: none; border: none; color: var(--text-muted);
      font-size: 18px; cursor: pointer; line-height: 1;
    }
    .detail-close:hover { color: var(--text); }
    .detail h3 { font-size: 15px; font-weight: 600; margin-bottom: 14px; padding-right: 24px; }
    .detail .row { margin-bottom: 10px; }
    .detail .label {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--text-muted); margin-bottom: 3px;
    }
    .detail .value { font-size: 13px; line-height: 1.4; }
    .detail .tags { display: flex; gap: 5px; flex-wrap: wrap; margin-top: 3px; }
    .detail .tag {
      padding: 3px 9px; background: rgba(122, 162, 247, 0.12);
      color: var(--accent); border-radius: 6px; font-size: 11px;
    }
    .detail .edges-title {
      font-size: 10px; text-transform: uppercase; letter-spacing: 0.8px;
      color: var(--text-muted); margin: 14px 0 6px;
    }
    .detail .edge-row {
      padding: 6px 0; font-size: 12px;
      border-bottom: 1px solid var(--border);
      display: flex; align-items: center; gap: 6px;
    }
    .detail .edge-row:last-child { border-bottom: none; }
    .edge-rel {
      padding: 2px 6px; border-radius: 4px; font-size: 10px;
      font-weight: 600; text-transform: uppercase;
    }
    .rel-relates_to { background: rgba(122, 162, 247, 0.15); color: var(--accent); }
    .rel-supersedes { background: rgba(247, 118, 142, 0.15); color: var(--red); }
    .rel-caused_by { background: rgba(224, 175, 104, 0.15); color: var(--orange); }
    .rel-contains { background: rgba(158, 206, 106, 0.15); color: var(--green); }

    /* ---- Toolbar ---- */
    .toolbar {
      position: absolute; top: 20px; left: 20px;
      display: flex; gap: 6px;
    }
    .tool-btn {
      padding: 7px 14px; background: var(--surface);
      border: 1px solid var(--border); border-radius: var(--radius);
      color: var(--text-muted); cursor: pointer; font-size: 12px;
      transition: all 0.15s;
    }
    .tool-btn:hover { border-color: var(--accent); color: var(--accent); }

    /* ---- Empty State ---- */
    .empty {
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      height: 100%; text-align: center; padding: 40px;
    }
    .empty-icon { font-size: 48px; margin-bottom: 12px; opacity: 0.3; }
    .empty-title { font-size: 16px; font-weight: 600; margin-bottom: 6px; }
    .empty-hint { font-size: 13px; color: var(--text-muted); line-height: 1.5; }

    /* ---- Tooltip ---- */
    .edge-tooltip {
      position: absolute; padding: 6px 10px;
      background: var(--surface2); border: 1px solid var(--border);
      border-radius: 6px; font-size: 11px; color: var(--text);
      pointer-events: none; display: none; z-index: 10;
      white-space: nowrap;
    }
  </style>
</head>
<body>

<header>
  <div class="logo"><span>Context0</span> Memory Graph</div>
  <div class="header-stats">
    <div>Nodes <b id="s-nodes">-</b></div>
    <div>Edges <b id="s-edges">-</b></div>
    <div>Version <b id="s-ver">-</b></div>
  </div>
</header>

<div class="main">
  <!-- Sidebar -->
  <div class="sidebar">
    <div class="sidebar-section">
      <h3>API Key</h3>
      <input class="key-input" id="apikey" placeholder="Paste your API key..." />
    </div>

    <div class="sidebar-section">
      <h3>Search</h3>
      <input class="search-input" id="search" placeholder="Search memories..." />
      <div class="type-filters">
        <button class="type-pill active" data-type="all">All</button>
        <button class="type-pill" data-type="semantic">Semantic</button>
        <button class="type-pill" data-type="episodic">Episodic</button>
        <button class="type-pill" data-type="procedural">Procedural</button>
      </div>
    </div>

    <div class="memory-list" id="list"></div>
  </div>

  <!-- Graph -->
  <div class="graph-area">
    <div id="cy"></div>

    <div class="toolbar">
      <button class="tool-btn" onclick="showAllGraph()">Show All</button>
      <button class="tool-btn" onclick="cy.fit(undefined,50)">Fit</button>
      <button class="tool-btn" onclick="loadData()">Refresh</button>
    </div>

    <div class="legend">
      <h4>Node Types</h4>
      <div class="legend-row"><div class="legend-dot" style="background:var(--green)"></div> Semantic (facts)</div>
      <div class="legend-row"><div class="legend-dot" style="background:var(--orange)"></div> Episodic (events)</div>
      <div class="legend-row"><div class="legend-dot" style="background:var(--purple)"></div> Procedural (how-to)</div>
      <h4 style="margin-top:10px">Edge Types</h4>
      <div class="legend-row"><div class="legend-line" style="background:var(--accent)"></div> relates to</div>
      <div class="legend-row"><div class="legend-line" style="background:var(--red)"></div> supersedes</div>
      <div class="legend-row"><div class="legend-line" style="background:var(--orange)"></div> caused by</div>
    </div>

    <div class="detail" id="detail">
      <button class="detail-close" onclick="closeDetail()">&times;</button>
      <h3 id="d-title"></h3>
      <div id="d-body"></div>
    </div>

    <div class="edge-tooltip" id="tooltip"></div>
  </div>
</div>

<script>
const API = window.location.origin;
let KEY = new URLSearchParams(window.location.search).get('key') || '';
let memories = [];
let filter = 'all';
let cy;

function headers() {
  const h = {};
  const k = document.getElementById('apikey').value || KEY;
  if (k) h['X-API-Key'] = k;
  return h;
}

// ---- Cytoscape ----
function initCy() {
  cy = cytoscape({
    container: document.getElementById('cy'),
    style: [
      { selector: 'node', style: {
        'label': 'data(label)',
        'text-wrap': 'wrap', 'text-max-width': '140px',
        'font-size': '12px', 'color': '#e1e2e8',
        'text-valign': 'center', 'text-halign': 'center',
        'width': 'label', 'height': 'label',
        'padding': '14px',
        'shape': 'round-rectangle',
        'border-width': 2, 'border-opacity': 0.6,
        'text-outline-width': 0,
        'font-weight': 500,
      }},
      { selector: 'node[type="semantic"]', style: {
        'background-color': 'rgba(158,206,106,0.12)', 'border-color': '#9ece6a', 'color': '#9ece6a',
      }},
      { selector: 'node[type="episodic"]', style: {
        'background-color': 'rgba(224,175,104,0.12)', 'border-color': '#e0af68', 'color': '#e0af68',
      }},
      { selector: 'node[type="procedural"]', style: {
        'background-color': 'rgba(187,154,247,0.12)', 'border-color': '#bb9af7', 'color': '#bb9af7',
      }},
      { selector: 'node:selected', style: {
        'border-width': 3, 'border-color': '#7aa2f7',
        'background-color': 'rgba(122,162,247,0.15)',
        'color': '#e1e2e8',
      }},
      { selector: 'node.faded', style: { 'opacity': 0.25 }},
      { selector: 'edge', style: {
        'width': 2, 'line-color': '#262836',
        'target-arrow-color': '#262836', 'target-arrow-shape': 'triangle',
        'curve-style': 'bezier', 'arrow-scale': 0.8,
        'opacity': 0.7,
      }},
      { selector: 'edge[rel="supersedes"]', style: {
        'line-color': '#f7768e', 'target-arrow-color': '#f7768e', 'line-style': 'dashed',
      }},
      { selector: 'edge[rel="caused_by"]', style: {
        'line-color': '#e0af68', 'target-arrow-color': '#e0af68',
      }},
      { selector: 'edge[rel="relates_to"]', style: {
        'line-color': '#7aa2f7', 'target-arrow-color': '#7aa2f7',
      }},
      { selector: 'edge[rel="contains"]', style: {
        'line-color': '#9ece6a', 'target-arrow-color': '#9ece6a',
      }},
      { selector: 'edge.highlighted', style: { 'width': 3, 'opacity': 1 }},
      { selector: 'edge.faded', style: { 'opacity': 0.1 }},
    ],
    layout: { name: 'preset' },
    minZoom: 0.3, maxZoom: 2.5,
    wheelSensitivity: 0.3,
  });

  // Click node -> show detail and highlight neighborhood
  cy.on('tap', 'node', function(e) {
    highlightNeighborhood(e.target);
    showDetail(e.target.data());
  });

  // Click background -> clear
  cy.on('tap', function(e) {
    if (e.target === cy) {
      clearHighlight();
      closeDetail();
    }
  });

  // Hover edge -> show tooltip
  cy.on('mouseover', 'edge', function(e) {
    const d = e.target.data();
    const tip = document.getElementById('tooltip');
    tip.textContent = `${d.rel || 'edge'} (weight: ${parseFloat(d.weight || 1).toFixed(1)})`;
    tip.style.display = 'block';
  });
  cy.on('mouseout', 'edge', function() {
    document.getElementById('tooltip').style.display = 'none';
  });
  cy.on('mousemove', function(e) {
    const tip = document.getElementById('tooltip');
    if (tip.style.display === 'block') {
      tip.style.left = (e.renderedPosition.x + 15) + 'px';
      tip.style.top = (e.renderedPosition.y + 15) + 'px';
    }
  });
}

function highlightNeighborhood(node) {
  clearHighlight();
  const neighborhood = node.closedNeighborhood();
  cy.elements().not(neighborhood).addClass('faded');
  neighborhood.edges().addClass('highlighted');
  node.select();
}

function clearHighlight() {
  cy.elements().removeClass('faded').removeClass('highlighted');
  cy.elements().unselect();
}

// ---- API ----
async function fetchHealth() {
  try {
    const r = await fetch(`${API}/v1/health`, { headers: headers() });
    const d = await r.json();
    document.getElementById('s-nodes').textContent = d.nodeCount || 0;
    document.getElementById('s-edges').textContent = d.edgeCount || 0;
    document.getElementById('s-ver').textContent = d.version || '-';
  } catch(e) { console.error('health:', e); }
}

async function fetchMemories() {
  try {
    const r = await fetch(`${API}/v1/memories/query?query=&top_k=200`, { headers: headers() });
    if (!r.ok) {
      if (r.status === 401) {
        document.getElementById('list').innerHTML =
          '<div class="empty"><div class="empty-icon">&#128274;</div><div class="empty-title">API Key Required</div><div class="empty-hint">Paste your API key above to view memories</div></div>';
      }
      return [];
    }
    const d = await r.json();
    return (d.results || []).map(r => r.memory);
  } catch(e) { console.error('fetch:', e); return []; }
}

async function fetchSubgraph(id) {
  try {
    const r = await fetch(`${API}/v1/memories/${id}/graph?depth=2`, { headers: headers() });
    if (!r.ok) return { nodes: [], edges: [] };
    return await r.json();
  } catch(e) { return { nodes: [], edges: [] }; }
}

// ---- Type helpers ----
function typeStr(t) {
  return ({ 'MEMORY_TYPE_EPISODIC':'episodic','MEMORY_TYPE_SEMANTIC':'semantic',
    'MEMORY_TYPE_PROCEDURAL':'procedural','1':'episodic','2':'semantic','3':'procedural' })[t] || 'semantic';
}
function relStr(r) {
  return ({ 'RELATIONSHIP_TYPE_RELATES_TO':'relates_to','RELATIONSHIP_TYPE_SUPERSEDES':'supersedes',
    'RELATIONSHIP_TYPE_CAUSED_BY':'caused_by','1':'relates_to','2':'supersedes','3':'caused_by' })[r] || 'relates_to';
}
function short(s, n) { return s && s.length > n ? s.slice(0, n) + '...' : s || ''; }
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }

// ---- Render List ----
function renderList() {
  const el = document.getElementById('list');
  const q = document.getElementById('search').value.toLowerCase();

  let items = memories;
  if (filter !== 'all') items = items.filter(m => typeStr(m.type) === filter);
  if (q) items = items.filter(m =>
    m.content.toLowerCase().includes(q) ||
    (m.tags || []).some(t => t.toLowerCase().includes(q))
  );

  if (items.length === 0) {
    el.innerHTML = '<div class="empty"><div class="empty-icon">&#128065;</div><div class="empty-title">No memories</div><div class="empty-hint">Store memories via CLI or API, then refresh</div></div>';
    return;
  }

  el.innerHTML = items.map(m => {
    const t = typeStr(m.type);
    const date = m.createdAt ? new Date(m.createdAt).toLocaleDateString() : '';
    const tags = (m.tags || []).slice(0, 3).join(', ');
    return `<div class="mem-card" data-id="${m.id}" onclick="selectMem('${m.id}')">
      <span class="badge badge-${t}">${t}</span>
      <div class="text">${esc(m.content)}</div>
      <div class="sub"><span>${date}</span>${tags ? '<span>' + esc(tags) + '</span>' : ''}</div>
    </div>`;
  }).join('');
}

// ---- Select memory -> show its neighborhood ----
async function selectMem(id) {
  document.querySelectorAll('.mem-card').forEach(c => c.classList.remove('selected'));
  const card = document.querySelector(`.mem-card[data-id="${id}"]`);
  if (card) card.classList.add('selected');

  const mem = memories.find(m => m.id === id);
  if (mem) showDetail({ ...mem, type: typeStr(mem.type) });

  // Fetch subgraph and render
  const sub = await fetchSubgraph(id);
  renderNeighborhood(id, sub);
}

// ---- Render: focused neighborhood view ----
function renderNeighborhood(centerId, sub) {
  cy.elements().remove();
  const elems = [];
  const seen = new Set();

  const center = memories.find(m => m.id === centerId);
  if (center) {
    seen.add(centerId);
    elems.push({ data: {
      id: centerId,
      label: short(center.content, 40),
      type: typeStr(center.type),
      ...center,
    }});
  }

  for (const n of (sub.nodes || [])) {
    if (seen.has(n.id)) continue;
    seen.add(n.id);
    elems.push({ data: {
      id: n.id,
      label: short(n.content, 35),
      type: typeStr(n.type),
      ...n,
    }});
  }

  for (const e of (sub.edges || [])) {
    if (seen.has(e.fromId) && seen.has(e.toId)) {
      elems.push({ data: {
        id: e.id, source: e.fromId, target: e.toId,
        rel: relStr(e.relationship),
        weight: e.weight || 1,
      }});
    }
  }

  // If API returned neighbors but no edges, draw implicit edges from center
  if ((sub.nodes || []).length > 0 && (sub.edges || []).length === 0) {
    for (const n of (sub.nodes || [])) {
      elems.push({ data: {
        id: `imp-${centerId}-${n.id}`, source: centerId, target: n.id,
        rel: 'relates_to', weight: 0.5,
      }});
    }
  }

  cy.add(elems);
  cy.layout({
    name: 'concentric',
    concentric: n => n.id() === centerId ? 2 : 1,
    levelWidth: () => 1,
    minNodeSpacing: 80,
    animate: true, animationDuration: 400,
  }).run();
}

// ---- Render: full overview ----
function showAllGraph() {
  cy.elements().remove();
  const elems = [];

  for (const m of memories) {
    elems.push({ data: {
      id: m.id,
      label: short(m.content, 28),
      type: typeStr(m.type),
      ...m,
    }});
  }

  // Connect by shared tags
  for (let i = 0; i < memories.length; i++) {
    for (let j = i + 1; j < memories.length; j++) {
      const a = memories[i], b = memories[j];
      const shared = (a.tags || []).filter(t => (b.tags || []).includes(t));
      if (shared.length > 0) {
        elems.push({ data: {
          id: `t-${a.id.slice(0,8)}-${b.id.slice(0,8)}`,
          source: a.id, target: b.id,
          rel: 'relates_to', weight: shared.length,
        }});
      }
    }
  }

  cy.add(elems);
  cy.layout({
    name: 'cose',
    animate: true, animationDuration: 600,
    nodeRepulsion: 12000,
    idealEdgeLength: 120,
    nodeDimensionsIncludeLabels: true,
  }).run();
}

// ---- Detail panel ----
function showDetail(d) {
  const panel = document.getElementById('detail');
  const t = d.type || typeStr(d.type);
  const tags = d.tags || [];
  const date = d.createdAt ? new Date(d.createdAt).toLocaleString() : '-';

  document.getElementById('d-title').innerHTML = `<span class="badge badge-${t}">${t}</span> Memory`;
  document.getElementById('d-body').innerHTML = `
    <div class="row"><div class="label">Content</div><div class="value">${esc(d.content || '')}</div></div>
    <div class="row"><div class="label">ID</div><div class="value" style="font-family:monospace;font-size:11px;color:var(--text-muted)">${d.id || ''}</div></div>
    <div class="row"><div class="label">Created</div><div class="value">${date}</div></div>
    <div class="row"><div class="label">Accessed</div><div class="value">${d.accessCount || 0} times</div></div>
    <div class="row"><div class="label">Decay Score</div><div class="value">${parseFloat(d.decayScore || 1).toFixed(3)}</div></div>
    ${tags.length ? `<div class="row"><div class="label">Tags</div><div class="tags">${tags.map(t => `<span class="tag">${esc(t)}</span>`).join('')}</div></div>` : ''}
  `;
  panel.classList.add('show');
}

function closeDetail() {
  document.getElementById('detail').classList.remove('show');
}

// ---- Load ----
async function loadData() {
  await fetchHealth();
  memories = await fetchMemories();
  renderList();

  // If we have memories, show the first one's neighborhood to give an initial view
  if (memories.length > 0 && cy.elements().length === 0) {
    selectMem(memories[0].id);
  }
}

// ---- Init ----
document.addEventListener('DOMContentLoaded', () => {
  initCy();

  // API key
  const keyEl = document.getElementById('apikey');
  keyEl.value = KEY;
  keyEl.addEventListener('change', () => { KEY = keyEl.value; loadData(); });

  // Search
  document.getElementById('search').addEventListener('input', renderList);

  // Filters
  document.querySelectorAll('.type-pill').forEach(btn => {
    btn.addEventListener('click', () => {
      document.querySelectorAll('.type-pill').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      filter = btn.dataset.type;
      renderList();
    });
  });

  loadData();
  setInterval(fetchHealth, 30000);
});
</script>
</body>
</html>
