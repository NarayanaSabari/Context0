<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Context0 — Memory Graph</title>
  <script src="https://unpkg.com/cytoscape@3.30.4/dist/cytoscape.min.js"></script>
  <style>
    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #30363d;
      --text: #e6edf3;
      --text-muted: #8b949e;
      --accent: #58a6ff;
      --green: #3fb950;
      --purple: #bc8cff;
      --orange: #d29922;
      --red: #f85149;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
    }

    header h1 {
      font-size: 18px;
      font-weight: 600;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    header h1 span { color: var(--accent); }

    .stats {
      display: flex;
      gap: 24px;
      font-size: 13px;
      color: var(--text-muted);
    }

    .stats .stat-value {
      color: var(--text);
      font-weight: 600;
      margin-left: 4px;
    }

    .main {
      display: flex;
      flex: 1;
      overflow: hidden;
    }

    .sidebar {
      width: 360px;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
    }

    .sidebar-header {
      padding: 12px 16px;
      border-bottom: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .sidebar-header h2 {
      font-size: 14px;
      font-weight: 600;
      flex: 1;
    }

    .search-box {
      margin: 12px 16px;
      position: relative;
    }

    .search-box input {
      width: 100%;
      padding: 8px 12px;
      background: var(--bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
    }

    .search-box input:focus { border-color: var(--accent); }

    .filters {
      padding: 0 16px 12px;
      display: flex;
      gap: 6px;
    }

    .filter-btn {
      padding: 4px 10px;
      font-size: 12px;
      border: 1px solid var(--border);
      border-radius: 20px;
      background: transparent;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.15s;
    }

    .filter-btn.active {
      background: var(--accent);
      color: #fff;
      border-color: var(--accent);
    }

    .filter-btn:hover:not(.active) {
      border-color: var(--text-muted);
      color: var(--text);
    }

    .memory-list {
      flex: 1;
      overflow-y: auto;
      padding: 0 8px;
    }

    .memory-item {
      padding: 10px 12px;
      border-radius: 6px;
      cursor: pointer;
      margin-bottom: 2px;
      transition: background 0.15s;
    }

    .memory-item:hover { background: rgba(88, 166, 255, 0.08); }
    .memory-item.selected { background: rgba(88, 166, 255, 0.15); }

    .memory-item .type-badge {
      display: inline-block;
      padding: 1px 6px;
      border-radius: 10px;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .type-episodic { background: rgba(210, 153, 34, 0.2); color: var(--orange); }
    .type-semantic { background: rgba(63, 185, 80, 0.2); color: var(--green); }
    .type-procedural { background: rgba(188, 140, 255, 0.2); color: var(--purple); }

    .memory-item .content {
      font-size: 13px;
      margin-top: 4px;
      line-height: 1.4;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .memory-item .meta {
      font-size: 11px;
      color: var(--text-muted);
      margin-top: 4px;
    }

    .graph-container {
      flex: 1;
      position: relative;
    }

    #cy {
      width: 100%;
      height: 100%;
    }

    .detail-panel {
      position: absolute;
      bottom: 16px;
      right: 16px;
      width: 340px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 16px;
      display: none;
      max-height: 50%;
      overflow-y: auto;
    }

    .detail-panel.visible { display: block; }

    .detail-panel h3 {
      font-size: 14px;
      margin-bottom: 8px;
    }

    .detail-panel .field {
      margin-bottom: 6px;
    }

    .detail-panel .field-label {
      font-size: 11px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .detail-panel .field-value {
      font-size: 13px;
      margin-top: 2px;
    }

    .detail-panel .tags {
      display: flex;
      gap: 4px;
      flex-wrap: wrap;
      margin-top: 4px;
    }

    .detail-panel .tag {
      padding: 2px 8px;
      background: rgba(88, 166, 255, 0.15);
      color: var(--accent);
      border-radius: 10px;
      font-size: 11px;
    }

    .detail-panel .edges-list {
      margin-top: 8px;
    }

    .detail-panel .edge-item {
      padding: 4px 0;
      font-size: 12px;
      border-bottom: 1px solid var(--border);
    }

    .detail-panel .edge-item:last-child { border-bottom: none; }

    .toolbar {
      position: absolute;
      top: 16px;
      right: 16px;
      display: flex;
      gap: 8px;
    }

    .toolbar button {
      padding: 6px 14px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      cursor: pointer;
      font-size: 12px;
      transition: all 0.15s;
    }

    .toolbar button:hover {
      border-color: var(--accent);
      color: var(--accent);
    }

    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: var(--text-muted);
      font-size: 14px;
      gap: 8px;
    }

    .empty-state .hint { font-size: 12px; }

    .loading { opacity: 0.5; pointer-events: none; }
  </style>
</head>
<body>
  <header>
    <h1><span>Context0</span> Memory Graph</h1>
    <div class="stats" id="stats">
      <div>Nodes: <span class="stat-value" id="stat-nodes">-</span></div>
      <div>Edges: <span class="stat-value" id="stat-edges">-</span></div>
      <div>Version: <span class="stat-value" id="stat-version">-</span></div>
    </div>
  </header>

  <div class="main">
    <div class="sidebar">
      <div class="sidebar-header">
        <h2>Memories</h2>
        <span id="memory-count" style="font-size:12px;color:var(--text-muted)"></span>
      </div>

      <div class="search-box">
        <input type="text" id="search" placeholder="Search memories..." />
      </div>

      <div class="filters">
        <button class="filter-btn active" data-type="all">All</button>
        <button class="filter-btn" data-type="episodic">Episodic</button>
        <button class="filter-btn" data-type="semantic">Semantic</button>
        <button class="filter-btn" data-type="procedural">Procedural</button>
      </div>

      <div class="memory-list" id="memory-list"></div>

      <div style="padding:12px 16px;border-top:1px solid var(--border)">
        <div style="font-size:11px;color:var(--text-muted);margin-bottom:4px">API Key</div>
        <input type="text" id="api-key-input" placeholder="Enter API key..."
          style="width:100%;padding:6px 10px;background:var(--bg);border:1px solid var(--border);border-radius:6px;color:var(--text);font-size:12px;font-family:monospace" />
      </div>
    </div>

    <div class="graph-container">
      <div id="cy"></div>

      <div class="toolbar">
        <button onclick="resetLayout()">Reset Layout</button>
        <button onclick="fitGraph()">Fit</button>
        <button onclick="loadAllData()">Refresh</button>
      </div>

      <div class="detail-panel" id="detail-panel">
        <h3 id="detail-title">Memory Details</h3>
        <div id="detail-content"></div>
      </div>
    </div>
  </div>

  <script>
    const API_BASE = window.location.origin;
    let API_KEY = new URLSearchParams(window.location.search).get('key') || '';
    let allMemories = [];
    let activeFilter = 'all';
    let cy;

    function getApiKey() {
      const input = document.getElementById('api-key-input');
      return input ? input.value : API_KEY;
    }

    // --- Cytoscape Setup ---
    function initGraph() {
      cy = cytoscape({
        container: document.getElementById('cy'),
        style: [
          {
            selector: 'node',
            style: {
              'label': 'data(label)',
              'text-wrap': 'wrap',
              'text-max-width': '120px',
              'font-size': '11px',
              'color': '#e6edf3',
              'text-valign': 'bottom',
              'text-margin-y': 8,
              'width': 40,
              'height': 40,
              'border-width': 2,
              'border-color': '#30363d',
            }
          },
          {
            selector: 'node[type="episodic"]',
            style: {
              'background-color': '#d29922',
              'border-color': '#d29922',
            }
          },
          {
            selector: 'node[type="semantic"]',
            style: {
              'background-color': '#3fb950',
              'border-color': '#3fb950',
            }
          },
          {
            selector: 'node[type="procedural"]',
            style: {
              'background-color': '#bc8cff',
              'border-color': '#bc8cff',
            }
          },
          {
            selector: 'node[type="session"]',
            style: {
              'background-color': '#58a6ff',
              'border-color': '#58a6ff',
              'shape': 'diamond',
            }
          },
          {
            selector: 'node[type="project"]',
            style: {
              'background-color': '#f85149',
              'border-color': '#f85149',
              'shape': 'hexagon',
              'width': 50,
              'height': 50,
            }
          },
          {
            selector: 'node:selected',
            style: {
              'border-width': 3,
              'border-color': '#58a6ff',
              'overlay-color': '#58a6ff',
              'overlay-opacity': 0.1,
            }
          },
          {
            selector: 'edge',
            style: {
              'width': 'data(weight)',
              'line-color': '#30363d',
              'target-arrow-color': '#30363d',
              'target-arrow-shape': 'triangle',
              'curve-style': 'bezier',
              'label': 'data(label)',
              'font-size': '9px',
              'color': '#8b949e',
              'text-rotation': 'autorotate',
              'text-margin-y': -8,
            }
          },
          {
            selector: 'edge[relationship="supersedes"]',
            style: {
              'line-color': '#f85149',
              'target-arrow-color': '#f85149',
              'line-style': 'dashed',
            }
          },
          {
            selector: 'edge[relationship="caused_by"]',
            style: {
              'line-color': '#d29922',
              'target-arrow-color': '#d29922',
            }
          },
          {
            selector: 'edge[relationship="relates_to"]',
            style: {
              'line-color': '#58a6ff',
              'target-arrow-color': '#58a6ff',
            }
          },
          {
            selector: 'edge[relationship="contains"]',
            style: {
              'line-color': '#3fb950',
              'target-arrow-color': '#3fb950',
            }
          },
        ],
        layout: { name: 'cose', animate: true, animationDuration: 500 },
        minZoom: 0.2,
        maxZoom: 3,
      });

      cy.on('tap', 'node', function(evt) {
        showDetail(evt.target.data());
      });

      cy.on('tap', function(evt) {
        if (evt.target === cy) {
          hideDetail();
        }
      });
    }

    // --- API Calls ---
    function apiHeaders() {
      const h = { 'Content-Type': 'application/json' };
      const key = getApiKey();
      if (key) h['X-API-Key'] = key;
      return h;
    }

    async function fetchHealth() {
      try {
        const resp = await fetch(`${API_BASE}/v1/health`, { headers: apiHeaders() });
        const data = await resp.json();
        document.getElementById('stat-nodes').textContent = data.nodeCount || '0';
        document.getElementById('stat-edges').textContent = data.edgeCount || '0';
        document.getElementById('stat-version').textContent = data.version || '-';
      } catch (e) {
        console.error('Health check failed:', e);
      }
    }

    async function fetchAllMemories() {
      try {
        const url = `${API_BASE}/v1/memories/query?query=&top_k=100`;
        const resp = await fetch(url, { headers: apiHeaders() });
        if (!resp.ok) {
          const err = await resp.text();
          console.error('Fetch memories failed:', resp.status, err);
          if (resp.status === 401) {
            document.getElementById('memory-list').innerHTML =
              '<div class="empty-state"><div>Authentication required</div><div class="hint">Enter your API key in the field below</div></div>';
          }
          return [];
        }
        const data = await resp.json();
        return (data.results || []).map(r => r.memory);
      } catch (e) {
        console.error('Fetch memories failed:', e);
        return [];
      }
    }

    async function fetchGraph(memoryId) {
      try {
        const url = `${API_BASE}/v1/memories/${memoryId}/graph?depth=2`;
        const resp = await fetch(url, { headers: apiHeaders() });
        return await resp.json();
      } catch (e) {
        console.error('Fetch graph failed:', e);
        return { nodes: [], edges: [] };
      }
    }

    // --- Render ---
    function typeFromProto(t) {
      const map = {
        'MEMORY_TYPE_EPISODIC': 'episodic',
        'MEMORY_TYPE_SEMANTIC': 'semantic',
        'MEMORY_TYPE_PROCEDURAL': 'procedural',
        '1': 'episodic', '2': 'semantic', '3': 'procedural',
      };
      return map[t] || 'semantic';
    }

    function relFromProto(r) {
      const map = {
        'RELATIONSHIP_TYPE_RELATES_TO': 'relates_to',
        'RELATIONSHIP_TYPE_SUPERSEDES': 'supersedes',
        'RELATIONSHIP_TYPE_CAUSED_BY': 'caused_by',
        '1': 'relates_to', '2': 'supersedes', '3': 'caused_by',
      };
      return map[r] || 'relates_to';
    }

    function truncate(s, len) {
      return s && s.length > len ? s.substring(0, len) + '...' : s;
    }

    function renderMemoryList(memories) {
      const list = document.getElementById('memory-list');
      const filtered = activeFilter === 'all'
        ? memories
        : memories.filter(m => typeFromProto(m.type) === activeFilter);

      const searchTerm = document.getElementById('search').value.toLowerCase();
      const searched = searchTerm
        ? filtered.filter(m => m.content.toLowerCase().includes(searchTerm) ||
            (m.tags || []).some(t => t.toLowerCase().includes(searchTerm)))
        : filtered;

      document.getElementById('memory-count').textContent = `(${searched.length})`;

      if (searched.length === 0) {
        list.innerHTML = '<div class="empty-state"><div>No memories found</div><div class="hint">Store memories via API or CLI</div></div>';
        return;
      }

      list.innerHTML = searched.map(m => {
        const type = typeFromProto(m.type);
        const date = m.createdAt ? new Date(m.createdAt).toLocaleString() : '';
        return `
          <div class="memory-item" data-id="${m.id}" onclick="selectMemory('${m.id}')">
            <span class="type-badge type-${type}">${type}</span>
            <div class="content">${escapeHtml(m.content)}</div>
            <div class="meta">${date} · accessed ${m.accessCount || 0}x</div>
          </div>`;
      }).join('');
    }

    async function selectMemory(id) {
      document.querySelectorAll('.memory-item').forEach(el => el.classList.remove('selected'));
      const item = document.querySelector(`.memory-item[data-id="${id}"]`);
      if (item) item.classList.add('selected');

      const graphData = await fetchGraph(id);
      renderGraph(id, graphData);

      const mem = allMemories.find(m => m.id === id);
      if (mem) showDetail({ ...mem, type: typeFromProto(mem.type) });
    }

    function renderGraph(centerId, graphData) {
      cy.elements().remove();

      const nodes = new Set();
      const elements = [];

      // Add center node
      const centerMem = allMemories.find(m => m.id === centerId);
      if (centerMem) {
        nodes.add(centerId);
        elements.push({
          data: {
            id: centerId,
            label: truncate(centerMem.content, 30),
            type: typeFromProto(centerMem.type),
            ...centerMem,
          }
        });
      }

      // Add neighbor nodes from graph response
      for (const n of (graphData.nodes || [])) {
        if (!nodes.has(n.id)) {
          nodes.add(n.id);
          elements.push({
            data: {
              id: n.id,
              label: truncate(n.content, 30),
              type: typeFromProto(n.type),
              ...n,
            }
          });
        }
      }

      // Add edges
      for (const e of (graphData.edges || [])) {
        if (nodes.has(e.fromId) && nodes.has(e.toId)) {
          elements.push({
            data: {
              id: e.id,
              source: e.fromId,
              target: e.toId,
              label: relFromProto(e.relationship),
              relationship: relFromProto(e.relationship),
              weight: Math.max(1, (e.weight || 1) * 3),
            }
          });
        }
      }

      // If no edges from API, show relates_to edges between memories with shared tags
      if ((graphData.edges || []).length === 0 && elements.length > 1) {
        for (let i = 0; i < elements.length; i++) {
          for (let j = i + 1; j < elements.length; j++) {
            const a = elements[i].data;
            const b = elements[j].data;
            if (a.tags && b.tags && a.id !== centerId && b.id !== centerId) continue;
            if (!a.id || !b.id || a.source || b.source) continue;
            elements.push({
              data: {
                id: `auto-${a.id}-${b.id}`,
                source: a.id === centerId ? a.id : b.id,
                target: a.id === centerId ? b.id : a.id,
                label: 'neighbor',
                relationship: 'relates_to',
                weight: 1,
              }
            });
          }
        }
      }

      cy.add(elements);
      cy.layout({ name: 'cose', animate: true, animationDuration: 500, nodeRepulsion: 8000 }).run();
    }

    function renderFullGraph(memories) {
      cy.elements().remove();
      const elements = [];

      for (const m of memories) {
        elements.push({
          data: {
            id: m.id,
            label: truncate(m.content, 25),
            type: typeFromProto(m.type),
            ...m,
          }
        });
      }

      // Auto-detect relationships via shared tags
      for (let i = 0; i < memories.length; i++) {
        for (let j = i + 1; j < memories.length; j++) {
          const a = memories[i];
          const b = memories[j];
          if (a.tags && b.tags) {
            const shared = (a.tags || []).filter(t => (b.tags || []).includes(t));
            if (shared.length > 0) {
              elements.push({
                data: {
                  id: `tag-${a.id}-${b.id}`,
                  source: a.id,
                  target: b.id,
                  label: shared[0],
                  relationship: 'relates_to',
                  weight: shared.length,
                }
              });
            }
          }
        }
      }

      cy.add(elements);
      cy.layout({ name: 'cose', animate: true, animationDuration: 800, nodeRepulsion: 10000 }).run();
    }

    function showDetail(data) {
      const panel = document.getElementById('detail-panel');
      const content = document.getElementById('detail-content');

      const type = data.type || typeFromProto(data.type);
      const tags = data.tags || [];
      const date = data.createdAt ? new Date(data.createdAt).toLocaleString() : '-';

      content.innerHTML = `
        <div class="field">
          <div class="field-label">Type</div>
          <div class="field-value"><span class="type-badge type-${type}">${type}</span></div>
        </div>
        <div class="field">
          <div class="field-label">Content</div>
          <div class="field-value">${escapeHtml(data.content || '')}</div>
        </div>
        <div class="field">
          <div class="field-label">ID</div>
          <div class="field-value" style="font-family:monospace;font-size:11px">${data.id || ''}</div>
        </div>
        <div class="field">
          <div class="field-label">Created</div>
          <div class="field-value">${date}</div>
        </div>
        <div class="field">
          <div class="field-label">Access Count</div>
          <div class="field-value">${data.accessCount || 0}</div>
        </div>
        <div class="field">
          <div class="field-label">Decay Score</div>
          <div class="field-value">${parseFloat(data.decayScore || 1).toFixed(3)}</div>
        </div>
        ${tags.length > 0 ? `
        <div class="field">
          <div class="field-label">Tags</div>
          <div class="tags">${tags.map(t => `<span class="tag">${escapeHtml(t)}</span>`).join('')}</div>
        </div>` : ''}
      `;

      panel.classList.add('visible');
    }

    function hideDetail() {
      document.getElementById('detail-panel').classList.remove('visible');
    }

    function escapeHtml(s) {
      const div = document.createElement('div');
      div.textContent = s;
      return div.innerHTML;
    }

    // --- Controls ---
    function resetLayout() {
      cy.layout({ name: 'cose', animate: true, animationDuration: 500 }).run();
    }

    function fitGraph() {
      cy.fit(undefined, 50);
    }

    async function loadAllData() {
      await fetchHealth();
      allMemories = await fetchAllMemories();
      renderMemoryList(allMemories);
      if (allMemories.length > 0) {
        renderFullGraph(allMemories);
      }
    }

    // --- Init ---
    document.addEventListener('DOMContentLoaded', () => {
      initGraph();
      loadAllData();

      // Search
      document.getElementById('search').addEventListener('input', () => {
        renderMemoryList(allMemories);
      });

      // Type filters
      document.querySelectorAll('.filter-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
          btn.classList.add('active');
          activeFilter = btn.dataset.type;
          renderMemoryList(allMemories);
        });
      });

      // API key input — set from URL param and reload on change.
      const keyInput = document.getElementById('api-key-input');
      keyInput.value = API_KEY;
      keyInput.addEventListener('change', () => {
        API_KEY = keyInput.value;
        loadAllData();
      });

      // Auto-refresh every 30s
      setInterval(loadAllData, 30000);
    });
  </script>
</body>
</html>
