// Kora Health Service API
//
// Defines the gRPC service for checking the operational status of the
// Kora memory engine.
syntax = "proto3";

package kora.v1;

option go_package = "github.com/NarayanaSabari/Kora/api/gen/kora/v1;korav1";

import "google/api/annotations.proto";

// HealthService provides a health check endpoint for the Kora memory engine.
// Used by load balancers, orchestrators, and monitoring systems to verify
// the engine is operational.
service HealthService {
  // Health returns the current health status, version, and graph statistics.
  rpc Health(HealthRequest) returns (HealthResponse) {
    option (google.api.http) = {
      get: "/v1/health"
    };
  }
}

// HealthRequest is the input to the Health RPC. Empty; no parameters needed.
message HealthRequest {}

// HealthResponse is the output of the Health RPC containing engine status
// and basic graph statistics.
message HealthResponse {
  // Current operational status of the engine (e.g., "ok", "degraded").
  string status = 1;

  // Semantic version of the running Kora engine build.
  string version = 2;

  // Total number of memory nodes currently stored in the graph.
  int64 node_count = 3;

  // Total number of edges currently stored in the graph.
  int64 edge_count = 4;
}
