// Context0 Session Service API
//
// Defines the gRPC service for managing agent interaction sessions.
// Sessions group related memories created during a single conversation.
syntax = "proto3";

package context0.v1;

option go_package = "github.com/context0/context0/api/gen/context0/v1;context0v1";

import "google/api/annotations.proto";
import "google/protobuf/timestamp.proto";

// SessionService manages the lifecycle of agent interaction sessions.
// Sessions provide temporal grouping of memories within a project.
service SessionService {
  // StartSession begins a new agent session and returns the created session.
  rpc StartSession(StartSessionRequest) returns (StartSessionResponse) {
    option (google.api.http) = {
      post: "/v1/sessions"
      body: "*"
    };
  }

  // EndSession closes an active session by setting its ended_at timestamp.
  rpc EndSession(EndSessionRequest) returns (EndSessionResponse) {
    option (google.api.http) = {
      post: "/v1/sessions/{id}/end"
    };
  }
}

// Session represents an agent interaction session in the Context0 system.
message Session {
  // Unique identifier for this session (UUID string).
  string id = 1;

  // Identifier of the project this session belongs to.
  string project_id = 2;

  // Identifier of the agent that owns this session.
  string agent_id = 3;

  // Timestamp when the session was opened.
  google.protobuf.Timestamp started_at = 4;

  // Timestamp when the session was closed. Unset while the session is active.
  google.protobuf.Timestamp ended_at = 5;
}

// StartSessionRequest is the input to the StartSession RPC.
message StartSessionRequest {
  // Project to create the session in.
  string project_id = 1;

  // Agent that will own this session.
  string agent_id = 2;
}

// StartSessionResponse is the output of the StartSession RPC.
message StartSessionResponse {
  // The newly created session.
  Session session = 1;
}

// EndSessionRequest is the input to the EndSession RPC.
message EndSessionRequest {
  // ID of the session to close.
  string id = 1;
}

// EndSessionResponse is the output of the EndSession RPC.
message EndSessionResponse {
  // The closed session with ended_at populated.
  Session session = 1;
}
