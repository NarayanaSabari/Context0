[project]
name = "context0-mcp"
version = "0.1.0"
description = "MCP server for Context0 memory engine"
authors = [
    {name = "Context0 Contributors"}
]
license = {text = "Apache-2.0"}
readme = "README.md"
requires-python = ">=3.10,<4.0"
dependencies = [
    "fastmcp (>=3.2.0,<4.0.0)",
    "httpx (>=0.28.1,<0.29.0)"
]


[project.scripts]
context0-mcp = "context0_mcp.server:main"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
